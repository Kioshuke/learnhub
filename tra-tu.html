<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tra từ Dictionary + Dịch</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #fff;
  }
  .box {
    background: #fff;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .box-header {
    background: #1a73e8;
    color: #fff;
    padding: 14px 16px;
    font-weight: 600;
    font-size: 15px;
    flex-shrink: 0;
  }
  .box-body { padding: 16px; flex: 1; overflow-y: auto; }
  .search-row { display: flex; gap: 8px; margin-bottom: 14px; }
  .search-row input {
    flex: 1;
    padding: 9px 12px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 14px;
    outline: none;
  }
  .search-row input:focus { border-color: #1a73e8; }
  .search-row button {
    background: #1a73e8;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 0 16px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .search-row button:hover { background: #1557b0; }
  .search-row button:disabled { background: #9db8e8; cursor: default; }

  .state-msg { font-size: 13px; color: #888; text-align: center; padding: 20px 0; }
  .state-msg.error { color: #d93025; }

  .result { display: none; }
  .word-line { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; flex-wrap: wrap; }
  .word-line .word { font-size: 20px; font-weight: 700; color: #1a1a1a; }
  .word-line .phonetic { font-size: 14px; color: #666; }
  .word-vi {
    font-size: 15px;
    font-weight: 600;
    color: #f9a825;
    margin-bottom: 12px;
  }
  .audio-btn {
    width: 28px; height: 28px;
    border-radius: 50%;
    border: 1px solid #ddd;
    background: #f8f9fa;
    cursor: pointer;
    font-size: 13px;
    display: flex; align-items: center; justify-content: center;
    color: #1a73e8;
  }
  .audio-btn:hover { background: #e8f0fe; }
  .audio-btn:disabled { opacity: 0.4; cursor: default; }

  .pos-tag {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    color: #1a73e8;
    background: #e8f0fe;
    padding: 2px 8px;
    border-radius: 10px;
    margin: 10px 6px 6px 0;
  }
  .pos-gloss {
    font-size: 14px;
    font-weight: 700;
    color: #e65100;
  }

  .meaning-block { margin-bottom: 8px; }
  .meaning-label { font-size: 11px; font-weight: 700; color: #999; text-transform: uppercase; margin-bottom: 2px; }
  .meaning-text { font-size: 14px; color: #333; line-height: 1.45; }
  .meaning-text.vi { color: #1a1a1a; background: #fff8e1; padding: 8px 10px; border-radius: 8px; border-left: 3px solid #f9a825; }
  .meaning-text.en { padding: 0 2px; }

  .example { font-size: 12.5px; color: #777; font-style: italic; margin-top: 4px; padding-left: 2px; }

  .disclaimer { font-size: 10.5px; color: #aaa; text-align: center; margin-top: 12px; }
</style>
</head>
<body>

<div class="box">
  <div class="box-header">🔎Tra Từ (Anh - Việt)</div>
  <div class="box-body">
    <div class="search-row">
      <input type="text" id="wordInput" placeholder="Nhập từ tiếng Anh..." onkeydown="if(event.key==='Enter') lookupWord()">
      <button id="searchBtn" onclick="lookupWord()">Tra</button>
    </div>

    <div class="state-msg" id="stateMsg">Nhập 1 từ tiếng Anh rồi bấm Tra cứu.</div>

    <div class="result" id="resultBox">
      <div class="word-line">
        <span class="word" id="rWord"></span>
        <span class="phonetic" id="rPhonetic"></span>
        <button class="audio-btn" id="rAudioBtn" onclick="playAudio()" disabled>🔊</button>
      </div>
      <div class="word-vi" id="rWordVi"></div>

      <div id="rMeaningsList"></div>

      <div class="disclaimer">Nghĩa tiếng Anh: dictionaryapi.dev · Nghĩa tiếng Việt: dịch máy (DeepL) — chỉ mang tính tham khảo.</div>
    </div>
  </div>
</div>

<script>
// ⚠️ Sau khi deploy deepl-proxy-worker.js lên Cloudflare, dán URL worker vào đây
const DEEPL_PROXY_URL = "https://deepl-proxy.quanhao678.workers.dev";

let currentAudioUrl = "";

async function lookupWord() {
  const raw = document.getElementById("wordInput").value.trim();
  if (!raw) return;

  const btn = document.getElementById("searchBtn");
  const stateMsg = document.getElementById("stateMsg");
  const resultBox = document.getElementById("resultBox");

  btn.disabled = true;
  resultBox.style.display = "none";
  stateMsg.style.display = "block";
  stateMsg.className = "state-msg";
  stateMsg.innerText = "Đang tra \"" + raw + "\"...";

  try {
    const word = raw.toLowerCase();

    // 1) Tra tiếng Anh
    const dictRes = await fetch("https://api.dictionaryapi.dev/api/v2/entries/en/" + encodeURIComponent(word));
    if (!dictRes.ok) {
      throw new Error("NOT_FOUND");
    }
    const dictData = await dictRes.json();
    const entry = dictData[0];

    // Lấy phiên âm + audio đầu tiên có sẵn
    let phonetic = entry.phonetic || "";
    let audioUrl = "";
    (entry.phonetics || []).forEach(p => {
      if (!phonetic && p.text) phonetic = p.text;
      if (!audioUrl && p.audio) audioUrl = p.audio;
    });
    if (audioUrl && audioUrl.startsWith("//")) audioUrl = "https:" + audioUrl;
    currentAudioUrl = audioUrl;

    // Lấy tất cả từ loại (part of speech) mà từ này có, mỗi cái 1 definition đầu tiên
    const meanings = entry.meanings || [];

    // 2) Dịch từ đơn (nghĩa nhanh của cả từ) + dịch song song từng definition sang tiếng Việt
    const wordViPromise = translateToVi(word).catch(() => "");

    const meaningsData = await Promise.all(meanings.map(async (m) => {
      const def = (m.definitions && m.definitions[0]) ? m.definitions[0] : null;
      const enText = def ? def.definition : "";
      const example = def ? def.example : "";
      let viText = "";
      if (enText) {
        try {
          viText = await translateToVi(enText);
        } catch (e) {
          viText = "(Không dịch được lúc này)";
        }
      }
      return { pos: m.partOfSpeech, en: enText, vi: viText, example };
    }));

    const wordVi = await wordViPromise;

    renderResult(entry.word, phonetic, wordVi, meaningsData);
    stateMsg.style.display = "none";
    resultBox.style.display = "block";

  } catch (err) {
    console.error("Lỗi tra từ:", err);
    stateMsg.className = "state-msg error";
    if (err.message === "NOT_FOUND") {
      stateMsg.innerText = "Không tìm thấy từ \"" + raw + "\" trong từ điển.";
    } else {
      stateMsg.innerText = "Có lỗi xảy ra, thử lại sau.";
    }
    resultBox.style.display = "none";
  } finally {
    btn.disabled = false;
  }
}

async function translateToVi(text) {
  const res = await fetch(DEEPL_PROXY_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ text: text, target_lang: "VI", source_lang: "EN" })
  });
  if (!res.ok) throw new Error("Lỗi dịch");
  const data = await res.json();
  if (data.error) throw new Error(data.error);
  return data.translatedText || "";
}

function shortGloss(viFull) {
  if (!viFull) return "";
  let seg = viFull.split(/[;,.]/)[0].trim();
  seg = seg.replace(/^(Để|Đã|Là|Một|Sẽ|Đang)\s+/i, "").trim();
  return seg;
}

function posAbbrev(pos) {
  const map = {
    "noun": "n",
    "verb": "v",
    "adjective": "adj",
    "adverb": "adv",
    "pronoun": "pron",
    "preposition": "prep",
    "conjunction": "conj",
    "interjection": "interj",
    "exclamation": "interj",
    "determiner": "det",
    "article": "art",
    "number": "num"
  };
  const key = (pos || "").toLowerCase().trim();
  return map[key] || key;
}

function renderResult(word, phonetic, wordVi, meaningsData) {
  document.getElementById("rWord").innerText = word;
  document.getElementById("rPhonetic").innerText = phonetic ? "/" + phonetic.replace(/\//g, "") + "/" : "";
  document.getElementById("rAudioBtn").disabled = !currentAudioUrl;
  const firstAbbrev = (meaningsData && meaningsData.length > 0) ? posAbbrev(meaningsData[0].pos) : "";
  document.getElementById("rWordVi").innerText = wordVi ? "→ " + (firstAbbrev ? "(" + firstAbbrev + ") " : "") + wordVi : "";

  const list = document.getElementById("rMeaningsList");
  list.innerHTML = "";

  meaningsData.forEach(m => {
    if (!m.en) return;
    const posTag = document.createElement("div");
    posTag.innerHTML = '<span class="pos-tag">' + m.pos + '</span> <span class="pos-gloss">— ' + (shortGloss(m.vi) || "?") + '</span>';
    list.appendChild(posTag);

    const block = document.createElement("div");
    block.className = "meaning-block";

    const enLabel = document.createElement("div");
    enLabel.className = "meaning-label";
    enLabel.innerText = "Tiếng Anh";
    const enText = document.createElement("div");
    enText.className = "meaning-text en";
    enText.innerText = m.en;

    const viLabel = document.createElement("div");
    viLabel.className = "meaning-label";
    viLabel.style.marginTop = "8px";
    viLabel.innerText = "Tiếng Việt";
    const viText = document.createElement("div");
    viText.className = "meaning-text vi";
    const abbrev = posAbbrev(m.pos);
    viText.innerText = (abbrev ? "(" + abbrev + ") " : "") + (m.vi || "(chưa có bản dịch)");

    block.appendChild(enLabel);
    block.appendChild(enText);
    block.appendChild(viLabel);
    block.appendChild(viText);

    if (m.example) {
      const ex = document.createElement("div");
      ex.className = "example";
      ex.innerText = "VD: " + m.example;
      block.appendChild(ex);
    }

    list.appendChild(block);
  });
}

function playAudio() {
  if (!currentAudioUrl) return;
  new Audio(currentAudioUrl).play();
}
</script>

</body>
</html>
