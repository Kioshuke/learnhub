<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FlashCard - LearnHub Platform</title>
  <link rel="icon" href="../../assets/images/favicon.png" sizes="any">

  <link rel="stylesheet" href="../../styles/global.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

  <style>
    :root {
      --primary: #2563eb;
      --glass: rgba(255, 255, 255, 0.82);
      --line: rgba(148, 163, 184, 0.35);
      --text-main: #0f172a;
      --text-sub: #475569;
      --chip: rgba(37, 99, 235, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      --hub-hover-x: 50%;
      --hub-hover-y: 24%;
      --hub-hover-glow: rgba(37, 99, 235, 0);
      --hub-hover-opacity: 0;
      margin: 0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      color: var(--text-main);
      min-height: 100vh;
      background:
        radial-gradient(circle at 12% 8%, rgba(236, 72, 153, 0.12), transparent 28%),
        radial-gradient(circle at 88% 16%, rgba(37, 99, 235, 0.14), transparent 30%),
        radial-gradient(circle at 72% 86%, rgba(245, 158, 11, 0.1), transparent 32%),
        linear-gradient(135deg, #f8fbff 0%, #fff7fb 44%, #f8fffb 100%);
      background-attachment: fixed;
      position: relative;
      overflow-x: hidden;
      isolation: isolate;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        linear-gradient(rgba(148, 163, 184, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(148, 163, 184, 0.08) 1px, transparent 1px);
      background-size: 34px 34px;
      mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.55), transparent 78%);
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      opacity: var(--hub-hover-opacity);
      background:
        radial-gradient(circle at var(--hub-hover-x) var(--hub-hover-y), var(--hub-hover-glow), transparent 34%),
        linear-gradient(135deg, var(--hub-hover-glow), transparent 56%);
      transition: opacity 0.25s ease, background 0.25s ease;
    }

    .wrap {
      position: relative;
      z-index: 1;
      max-width: 1200px;
      margin: 0 auto;
      padding: 32px 18px 40px;
    }

    .hero {
      text-align: center;
      margin-bottom: 22px;
    }

    .hero h1 {
      margin: 0 0 10px;
      font-size: clamp(28px, 4vw, 46px);
      letter-spacing: 0.3px;
      color: var(--primary);
    }

    .hero p {
      margin: 0 auto;
      max-width: 760px;
      color: var(--text-sub);
      line-height: 1.6;
    }

    .toolbar {
      display: flex;
      justify-content: center;
      margin-top: 18px;
      margin-bottom: 8px;
      position: relative;
    }

    .filter {
      width: min(360px, 100%);
      position: relative;
    }

    .filter-btn {
      width: 100%;
      border: 1px solid #cbd5e1;
      background: rgba(255, 255, 255, 0.98);
      color: #0f172a;
      border-radius: 14px;
      padding: 11px 14px;
      font-size: 15px;
      font-weight: 700;
      box-shadow: 0 8px 18px rgba(37, 99, 235, 0.12);
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
    }

    .filter-caret {
      font-size: 14px;
      color: #2563eb;
      transition: transform 0.2s ease;
    }

    .filter.open .filter-caret {
      transform: rotate(180deg);
    }

    .filter-menu {
      list-style: none;
      margin: 8px 0 0;
      padding: 8px;
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      border-radius: 14px;
      border: 1px solid #dbe4f0;
      background: rgba(255, 255, 255, 0.98);
      box-shadow: 0 14px 30px rgba(15, 23, 42, 0.16);
      display: none;
      z-index: 20;
      transform-origin: top center;
      animation: dropdownIn 0.2s ease;
    }

    .filter.open .filter-menu {
      display: block;
    }

    .filter-item {
      width: 100%;
      border: none;
      background: transparent;
      text-align: left;
      border-radius: 10px;
      padding: 10px 10px;
      font-size: 14px;
      font-weight: 600;
      color: #334155;
      cursor: pointer;
    }

    .filter-item:hover,
    .filter-item.active {
      background: rgba(37, 99, 235, 0.1);
      color: #1d4ed8;
    }

    .section-block {
      --section-accent: #2563eb;
      --section-accent-dark: #1d4ed8;
      --section-soft: rgba(37, 99, 235, 0.12);
      --section-border: rgba(37, 99, 235, 0.35);
      --section-glow: rgba(124, 58, 237, 0.42);
      margin-top: 28px;
      animation: sectionFadeIn 0.45s ease both;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .section-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 40px;
    }

    .section-title {
      margin: 0;
      font-size: clamp(20px, 2.8vw, 28px);
      color: var(--section-accent);
    }

    .section-note {
      min-width: 44px;
      color: #475569;
      font-size: 15px;
      font-weight: 800;
      line-height: 1;
      text-align: center;
      white-space: nowrap;
    }

    .section-nav {
      width: 40px;
      height: 40px;
      border: 1px solid var(--section-border);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.96);
      color: var(--section-accent);
      cursor: pointer;
      font-size: 28px;
      font-weight: 800;
      line-height: 0;
      display: inline-grid;
      place-items: center;
      padding: 0 0 3px;
      box-shadow: 0 8px 16px var(--section-soft);
      transition: transform 0.15s ease, opacity 0.15s ease, border-color 0.15s ease;
    }

    .section-nav:hover:not(:disabled) {
      transform: translateY(-2px);
      border-color: var(--section-accent);
    }

    .section-nav:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      box-shadow: none;
    }

    .topic-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      grid-auto-rows: 1fr;
      gap: 16px;
      margin-top: 28px;
      align-items: stretch;
    }

    .topic-slider {
      --slide-index: 0;
      --slide-step: calc((100% + 16px) / 3);
      margin: 28px -15px -22px;
      overflow-x: hidden;
      overflow-y: visible;
      padding: 0 15px 22px;
    }

    .topic-slider .topic-grid {
      display: flex;
      grid-template-columns: none;
      gap: 16px;
      margin-top: 0;
      transform: translateX(calc(var(--slide-index) * -1 * var(--slide-step)));
      transition: transform 0.36s ease;
      align-items: stretch;
    }

    .topic-slider .topic-card {
      flex: 0 0 calc((100% - 32px) / 3);
    }

    .topic-card {
      position: relative;
      overflow: hidden;
      border-radius: 22px;
      background: var(--glass);
      border: 1px solid var(--line);
      outline: 0 solid transparent;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease, outline-color 0.2s ease, outline-width 0.2s ease;
      min-height: 210px;
      height: 100%;
      animation: cardFloatIn 0.35s ease both;
    }

    .topic-card::before {
      content: "";
      position: absolute;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      right: -60px;
      top: -80px;
      background: radial-gradient(circle, var(--section-soft), transparent 70%);
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .topic-card:hover {
      transform: translateY(-7px) scale(1.018);
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.98), var(--section-soft));
      border-color: var(--section-accent);
      outline: 3px solid var(--section-soft);
    }

    .topic-card:hover::before {
      opacity: 1;
      transform: scale(1.16);
      background: radial-gradient(circle, var(--section-glow), transparent 70%);
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .chip {
      font-size: 12px;
      padding: 5px 10px;
      border-radius: 999px;
      background: var(--section-soft);
      border: 1px solid var(--section-border);
      color: var(--section-accent-dark);
      white-space: nowrap;
    }

    .fc-hub-grip {
      color: var(--section-accent);
      font-size: 13px;
      cursor: grab;
      padding: 2px 4px;
      opacity: .75;
      flex: none;
    }
    .fc-hub-grip:hover { opacity: 1; }
    .topic-card.dragging { opacity: .4; border-style: dashed; }
    .topic-card.d-over { border-color: var(--section-accent); background: var(--section-soft); box-shadow: 0 0 0 2px var(--section-border); }

    .status-badge {
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 999px;
      font-weight: 700;
      white-space: nowrap;
    }

    .status-done {
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
    }

    .status-update {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: white;
    }

    .card-updating-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 999px;
      font-weight: 700;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: white;
      animation: badgePulse 2s ease-in-out infinite;
    }

    @keyframes badgePulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }

    .open-btn.updating {
      background: linear-gradient(135deg, #94a3b8, #64748b) !important;
      box-shadow: 0 8px 16px rgba(100, 116, 139, 0.3) !important;
      cursor: not-allowed;
    }

    .open-btn.updating:hover {
      transform: none;
    }

    .topic-title {
      margin: 0;
      font-size: 22px;
      font-weight: 800;
    }

    .topic-desc {
      margin: 0;
      color: var(--text-sub);
      line-height: 1.55;
      font-size: 14px;
      min-height: 44px;
    }

    .meta {
      margin-top: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .count {
      color: var(--section-accent-dark);
      font-size: 13px;
      opacity: 0.9;
    }

    .open-btn {
      border: none;
      border-radius: 12px;
      padding: 10px 14px;
      cursor: pointer;
      color: white;
      background: linear-gradient(135deg, var(--section-accent), var(--section-accent-dark));
      font-weight: 700;
      white-space: nowrap;
      box-shadow: 0 8px 16px var(--section-border);
      transition: transform 0.15s ease;
    }

    .open-btn:hover {
      transform: translateY(-2px);
    }

    .loading-overlay {
      position: fixed;
      inset: 0;
      z-index: 120;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(15, 23, 42, 0.55);
      backdrop-filter: blur(20px) saturate(1.15);
      -webkit-backdrop-filter: blur(20px) saturate(1.15);
    }

    .loading-overlay.show {
      display: flex;
      animation: overlayFade 0.25s ease;
    }

    .loading-box {
      position: relative;
      overflow: hidden;
      width: min(340px, 100%);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      background: linear-gradient(145deg, rgba(30, 41, 59, 0.95), rgba(15, 23, 42, 0.92));
      padding: 36px 24px 28px;
      text-align: center;
      animation: popupIn 0.3s cubic-bezier(0.22, 1, 0.36, 1);
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.25);
    }

    .loading-box::before {
      content: "";
      position: absolute;
      inset: 0 0 auto;
      height: 4px;
      background: linear-gradient(90deg, #ec4899, #8b5cf6, #3b82f6, #f59e0b);
      background-size: 300% 100%;
      animation: loadingBarShimmer 1.8s ease-in-out infinite;
    }

    @keyframes loadingBarShimmer {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .loading-emoji {
      font-size: 48px;
      display: block;
      margin: 0 auto 14px;
      animation: loadingBounce 0.8s ease-in-out infinite alternate;
    }

    @keyframes loadingBounce {
      from { transform: translateY(0) scale(1); }
      to { transform: translateY(-10px) scale(1.08); }
    }

    .loading-title {
      margin: 0 0 6px;
      color: #f1f5f9;
      font-size: 19px;
      font-weight: 700;
    }

    .loading-text {
      margin: 0 0 14px;
      color: #94a3b8;
      line-height: 1.5;
      font-weight: 500;
      font-size: 14px;
    }

    .loading-dots {
      display: flex;
      gap: 6px;
      justify-content: center;
    }

    .loading-dots span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #3b82f6;
      animation: dotPulse 1.2s ease-in-out infinite;
    }

    .loading-dots span:nth-child(2) { animation-delay: 0.15s; background: #8b5cf6; }
    .loading-dots span:nth-child(3) { animation-delay: 0.3s; background: #ec4899; }

    @keyframes dotPulse {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40% { transform: scale(1); opacity: 1; }
    }

    @keyframes dropdownIn {
      from { opacity: 0; transform: translateY(-6px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes sectionFadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes cardFloatIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes overlayFade {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes popupIn {
      from { opacity: 0; transform: translateY(10px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ===== SKELETON LOADING (cho lưới thẻ chủ đề, tránh giật khi dựng DOM nặng) ===== */
    .skel-bar {
      background: linear-gradient(90deg, #e2e9f5 25%, #f2f6fc 37%, #e2e9f5 63%);
      background-size: 400% 100%;
      animation: skeletonShimmer 1.4s ease infinite;
      border-radius: 8px;
    }

    @keyframes skeletonShimmer {
      0% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .skel-section {
      margin-top: 28px;
    }

    .skel-section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .skel-title {
      width: 200px;
      height: 26px;
    }

    .skel-note {
      width: 60px;
      height: 20px;
    }

    .skel-card {
      border-radius: 22px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.6);
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 210px;
    }

    .skel-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .skel-chip {
      width: 64px;
      height: 20px;
      border-radius: 999px;
    }

    .skel-card-title {
      width: 70%;
      height: 20px;
    }

    .skel-card-desc {
      width: 100%;
      height: 14px;
    }

    .skel-card-desc.short {
      width: 60%;
    }

    .skel-card-meta {
      margin-top: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .skel-count {
      width: 50px;
      height: 14px;
    }

    .skel-btn {
      width: 80px;
      height: 34px;
      border-radius: 12px;
    }

    /* ===== EMPTY STATE ===== */
    .hub-empty {
      text-align: center;
      padding: 60px 20px 50px;
      animation: sectionFadeIn 0.45s ease both;
    }
    .hub-empty-icon {
      width: 80px; height: 80px; margin: 0 auto 18px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(37,99,235,0.1), rgba(124,58,237,0.1));
      display: flex; align-items: center; justify-content: center;
      font-size: 36px;
      animation: maintenancePulse 2.5s ease-in-out infinite;
    }
    .hub-empty h3 { margin: 0 0 8px; font-size: 18px; color: var(--text-main); font-weight: 700; }
    .hub-empty p { margin: 0 auto; max-width: 380px; font-size: 14px; color: var(--text-sub); line-height: 1.6; }
    .hub-empty .hub-empty-contact {
      display: inline-flex; align-items: center; gap: 6px;
      margin-top: 16px; padding: 10px 20px; border-radius: 12px;
      background: rgba(37,99,235,0.08); border: 1px solid rgba(37,99,235,0.2);
      color: #2563eb; font-size: 13px; font-weight: 600;
      text-decoration: none; transition: all 0.2s ease;
    }
    .hub-empty .hub-empty-contact:hover { background: rgba(37,99,235,0.14); transform: translateY(-1px); }
    .section-empty {
      margin: 22px 0 0;
      padding: 18px;
      border: 1px dashed var(--section-border);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.6);
      color: var(--text-sub);
      font-size: 14px;
      text-align: center;
    }
    @media (max-width: 860px) {
      .topic-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .topic-slider {
        --slide-step: calc((100% + 16px) / 2);
      }

      .topic-slider .topic-card {
        flex-basis: calc((100% - 16px) / 2);
      }
    }

    @media (max-width: 620px) {
      .section-header {
        align-items: flex-start;
        flex-direction: column;
      }

      .section-actions {
        align-self: flex-end;
        justify-content: flex-end;
      }

      .topic-grid {
        grid-template-columns: 1fr;
      }

      .topic-slider {
        --slide-step: calc(100% + 16px);
      }

      .topic-slider .topic-card {
        flex-basis: 100%;
      }

      .share-box {
        padding: 18px 16px 16px;
      }

      .share-header h3 {
        font-size: 19px;
      }

      .share-qr {
        width: 190px;
        height: 190px;
      }

      .share-link-row {
        gap: 6px;
      }

      .share-copy-btn {
        padding: 10px 12px;
        font-size: 12px;
      }
    }
    /* ===== NÚT SHARE (cạnh nút Vào học) + MODAL CHIA SẺ ===== */
    .card-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 0 0 auto;
    }

    .share-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      padding: 0;
      border-radius: 12px;
      border: 1px solid var(--section-border, var(--line));
      background: rgba(255, 255, 255, 0.92);
      color: var(--section-accent-dark, var(--primary));
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 6px 14px rgba(15, 23, 42, 0.08);
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }

    .share-btn:hover {
      transform: translateY(-2px);
      background: var(--section-soft, rgba(37, 99, 235, 0.12));
      box-shadow: 0 10px 18px var(--section-border, var(--line));
    }

    .share-btn:active {
      transform: scale(0.95);
    }

    .share-modal {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(15, 23, 42, 0.5);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 3000;
    }

    .share-modal.show {
      display: flex;
      animation: hubShareFade 0.2s ease;
    }

    @keyframes hubShareFade {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .share-box {
      width: min(400px, 100%);
      padding: 22px 20px 20px;
      border-radius: 20px;
      background: #ffffff;
      border: 1px solid var(--line);
      box-shadow: 0 20px 40px rgba(15, 23, 42, 0.2);
      animation: hubSharePop 0.25s ease;
    }

    @keyframes hubSharePop {
      from { opacity: 0; transform: translateY(10px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .share-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .share-header h3 {
      margin: 0;
      font-size: 21px;
      font-weight: 800;
      color: var(--primary);
    }

    .share-close {
      width: 32px;
      height: 32px;
      padding: 0;
      border: none;
      border-radius: 8px;
      background: #ef4444;
      color: #fff;
      font-size: 15px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s ease;
    }

    .share-close:hover {
      background: #dc2626;
    }

    .share-sub {
      margin: 0 0 16px;
      color: var(--text-sub);
      font-size: 13px;
      font-weight: 600;

    const hubSections = document.getElementById("hubSections");
    const filterRoot = document.getElementById("categoryFilter");
    const filterBtn = document.getElementById("filterBtn");
    const filterMenu = document.getElementById("filterMenu");

    const sectionSlides = {};

    // Bấm Back thì trình duyệt khôi phục nguyên trạng trang (bfcache) -> phải reset cờ, nếu không các nút "Vào học" bị khóa

    let dbSectionAdded = false;

    // Hiện lỗi tải bộ từ DB ngay trên trang (kèm code HTTP) để dễ chẩn đoán.
    window.__hubLoadError = function(e) {
      const status = (e && e.status) ? ` [HTTP ${e.status}]` : "";
      const code = (e && e.code) ? ` (${e.code})` : "";
      const msg = (e && (e.message || e.error_description)) || String(e || "Lỗi không xác định");
      const el = document.createElement("div");
      el.style.cssText = "margin:14px auto;max-width:760px;padding:14px 16px;border:1px solid rgba(239,68,68,.35);border-radius:14px;background:rgba(254,242,242,.85);color:#b91c1c;font-size:13px;line-height:1.6;";
      const title = document.createElement("b");
      title.textContent = "Không tải được bộ từ từ dữ liệu";
      const detail = document.createElement("code");
      detail.style.cssText = "font-size:12px;color:#9a3412";
      detail.textContent = `${new Date().toISOString()}${status}${code} — ${msg}`;
      el.appendChild(title);
      el.appendChild(document.createElement("br"));
      el.appendChild(detail);
      (document.querySelector(".wrap") || document.body).appendChild(el);
    };

    // Mảng theme xoay vòng cho từng nhóm do giáo viên tạo.
    const DB_THEMES = [
      { accent: "#10b981", accentDark: "#059669", soft: "rgba(16,185,129,0.13)", border: "rgba(16,185,129,0.36)", glow: "rgba(52,211,153,0.4)" },
      { accent: "#8b5cf6", accentDark: "#7c3aed", soft: "rgba(139,92,246,0.13)", border: "rgba(139,92,246,0.36)", glow: "rgba(167,139,250,0.4)" },
      { accent: "#0ea5e9", accentDark: "#0284c7", soft: "rgba(14,165,233,0.13)", border: "rgba(14,165,233,0.36)", glow: "rgba(56,189,248,0.4)" },
      { accent: "#f59e0b", accentDark: "#d97706", soft: "rgba(245,158,11,0.13)", border: "rgba(245,158,11,0.36)", glow: "rgba(251,191,36,0.4)" },
      { accent: "#ef4444", accentDark: "#dc2626", soft: "rgba(239,68,68,0.13)", border: "rgba(239,68,68,0.36)", glow: "rgba(248,113,113,0.4)" },
      { accent: "#ec4899", accentDark: "#db2777", soft: "rgba(236,72,153,0.13)", border: "rgba(236,72,153,0.36)", glow: "rgba(244,114,182,0.4)" }
    ];

    // Hook nhận bộ từ từ DB (do script module ở dưới cùng gọi sau khi fetch xong).
    // Nhóm các bộ từ theo cột "category" — mỗi nhóm thành 1 section riêng.
    window.__hubAddDbSets = function(dbSets, groupStatus) {
      if (dbSectionAdded) return;
      dbSectionAdded = true;
      const list = dbSets || [];
      if (!list.length) return;

      const groupComplete = {};
      (groupStatus || []).forEach(g => { groupComplete[g.name] = g.is_complete === true; });

      const groups = {};
      list.forEach(s => {
        const cat = String(s.category || "").trim() || "Bộ Thẻ Giáo Viên";
        if (!groups[cat]) groups[cat] = [];
        groups[cat].push({
          name: s.name || "Bộ từ",
          description: s.description || "Bộ từ vựng do giáo viên soạn.",
          words: Number(s.card_count || 0),
          level: s.level || "Giáo viên",
          href: `flash.html?set=${s.set_id}`,
          isComplete: s.is_complete === true,
          dbSetId: s.set_id
        });
      });

      let gi = 0;
      Object.keys(groups).forEach(cat => {
        const theme = DB_THEMES[gi % DB_THEMES.length];
        // Nếu trùng tên nhóm tĩnh có sẵn (vd "Từ Vựng Theo Chủ Đề") → gộp vào nhóm đó luôn.
        const existing = sections.find(sec => sec.title === cat);
        if (existing) {
          existing.items = groups[cat].concat(existing.items);
          existing.note = `${existing.items.length} bộ`;
          existing.groupComplete = groupComplete[cat] === true;
        } else {
          sections.push({
            key: "teacher_" + gi,
            title: cat,
            note: `${groups[cat].length} bộ`,
            theme: theme,
            items: groups[cat],
            groupComplete: groupComplete[cat] === true
          });
          addFilterItem("teacher_" + gi, cat);
        }
        gi++;
      });
      renderHub(currentHubFilter);
    };

    function getVisibleCardCount() {
      if (window.innerWidth <= 620) return 1;
      if (window.innerWidth <= 860) return 2;
      return 3;
    }

    function getSectionStatusBadge(section) {
      if (typeof section.groupComplete === "boolean") {
        return section.groupComplete
          ? '<span class="status-badge status-done">Đã hoàn thành</span>'
          : '<span class="status-badge status-update">Đang được cập nhật</span>';
      }
      const all = section.items || [];
      if (all.length && all.every(it => it.isComplete === true)) {
        return '<span class="status-badge status-done">Đã hoàn thành</span>';
      } else {
        return '<span class="status-badge status-update">Đang được cập nhật</span>';
      }
    }

    function setHubBackgroundTheme(theme, event) {
      if (!theme) return;
      document.body.style.setProperty("--hub-hover-glow", theme.glow || theme.soft || "rgba(37, 99, 235, 0.22)");
      document.body.style.setProperty("--hub-hover-opacity", "1");
      updateHubBackgroundPosition(event);
    }

    function updateHubBackgroundPosition(event) {
      if (!event) return;
      const x = Math.round((event.clientX / window.innerWidth) * 100);
      const y = Math.round((event.clientY / window.innerHeight) * 100);
      document.body.style.setProperty("--hub-hover-x", `${x}%`);
      document.body.style.setProperty("--hub-hover-y", `${y}%`);
    }

    function clearHubBackgroundTheme() {
      document.body.style.setProperty("--hub-hover-opacity", "0");
    }

    function openLesson(topic) {
      if (isLoadingLesson) return;
      isLoadingLesson = true;

      if (topic.target === "_blank") {
        isLoadingLesson = false;
        window.open(topic.href, "_blank");
        return;
      }

      // Cập nhật title của iframe
      const deckName = topic.name || "FlashCard";
      document.title = `${deckName} - LearnHub Flashcard`;
      
      // Gửi tin nhắn lên parent kèm title ĐÃ CHUẨN HÓA (chứa Platform)
      try { 
        window.parent.postMessage({ 
          type: 'flashcard-title', 
          title: `${deckName} - LearnHub Platform` 
        }, '*'); 
      } catch (e) {}

      window.location.href = topic.href;
    }

    // ===== SHARE: sao chép liên kết + mã QR cho từng bộ thẻ =====
    function getHubShareUrl(topic) {
      const id = topic && topic.dbSetId;
      const origin = window.location.origin;
      const canUseSite = origin && origin !== "null";
      // Bộ thẻ lưu trên DB -> link mở qua web chính (giống link bài test ở phòng học).
      if (id && canUseSite) return origin + "/?open=flash&set=" + encodeURIComponent(id);
      try {
        const href = (topic && topic.href) || (id ? "flash.html?set=" + encodeURIComponent(id) : window.location.href);
        return new URL(href, window.location.href).href;
      } catch (e) {
        return window.location.href;
      }
    }

    function openHubShare(topic) {
      const modal = document.getElementById("hubShareModal");
      if (!modal) return;

      const url = getHubShareUrl(topic);
      const name = (topic && topic.name) || "bộ thẻ này";
      modal.dataset.url = url;

      const input = document.getElementById("hubShareLink");
      if (input) input.value = url;

      const sub = document.getElementById("hubShareSub");
      if (sub) sub.textContent = "Bộ thẻ: " + name;

      const qr = document.getElementById("hubShareQr");
      if (qr) qr.innerHTML = "";

      modal.classList.add("show");
      renderHubShareQr(url);
    }

    function closeHubShare() {
      const modal = document.getElementById("hubShareModal");
      if (modal) modal.classList.remove("show");
    }

    function renderHubShareQr(url) {
      const box = document.getElementById("hubShareQr");
      if (!box) return;
      box.innerHTML = "";

      const draw = () => {
        if (typeof window.QRCode !== "function") return false;
        try {
          new window.QRCode(box, {
            text: url,
            width: 200,
            height: 200,
            colorDark: "#0f172a",
            colorLight: "#ffffff",
            correctLevel: window.QRCode.CorrectLevel ? window.QRCode.CorrectLevel.M : 2
          });
          return true;
        } catch (e) {
          return false;
        }
      };

      if (draw()) return;

      // Thư viện QR (defer) có thể chưa sẵn sàng -> chờ ~3s rồi dùng ảnh QR dự phòng
      let tries = 0;
      const timer = setInterval(() => {
        tries++;
        if (draw()) {
          clearInterval(timer);
          return;
        }
        if (tries >= 20) {
          clearInterval(timer);
          box.innerHTML = "";
          const img = document.createElement("img");
          img.alt = "Mã QR bộ thẻ";
          img.loading = "lazy";
          img.src = "https://api.qrserver.com/v1/create-qr-code/?size=400x400&margin=0&data=" + encodeURIComponent(url);
          box.appendChild(img);
        }
      }, 150);
    }

    async function copyHubShareLink() {
      const modal = document.getElementById("hubShareModal");
      const url = (modal && modal.dataset.url) || window.location.href;
      let ok = false;

      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(url);
          ok = true;
        }
      } catch (e) {
        ok = false;
      }

      if (!ok) {
        try {
          const ta = document.createElement("textarea");
          ta.value = url;
          ta.setAttribute("readonly", "");
          ta.style.position = "fixed";
          ta.style.opacity = "0";
          document.body.appendChild(ta);
          ta.select();
          ta.setSelectionRange(0, url.length);
          ok = document.execCommand("copy");
          ta.remove();
        } catch (e) {
          ok = false;
        }
      }

      const btn = document.getElementById("hubShareCopyBtn");
      if (ok && btn) {
        btn.classList.add("is-copied");
        btn.innerHTML = '<i class="fa-solid fa-check"></i> Đã copy';
        setTimeout(() => {
          btn.classList.remove("is-copied");
          btn.innerHTML = '<i class="fa-regular fa-copy"></i> Sao chép';
        }, 1800);
      }

      if (typeof lhToast === "function") {
        lhToast(ok ? "Đã sao chép liên kết bộ thẻ." : "Không sao chép được, bạn hãy copy thủ công nhé.", {
          type: ok ? "success" : "error",
          title: ok ? "Đã copy" : "Không copy được",
          sound: false
        });
      }
    }

    (function buildHubShareModal() {
      const modal = document.createElement("div");
      modal.id = "hubShareModal";
      modal.className = "share-modal";
      modal.innerHTML = `
        <div class="share-box" role="dialog" aria-modal="true" aria-labelledby="hubShareTitle">
          <div class="share-header">
            <h3 id="hubShareTitle">Chia sẻ bộ thẻ</h3>
            <button id="hubShareClose" class="share-close" type="button" aria-label="Đóng">✕</button>
          </div>
          <p class="share-sub" id="hubShareSub">Gửi liên kết này để bạn bè mở đúng bộ flashcard.</p>
          <div class="share-link-row">
            <input id="hubShareLink" type="text" readonly value="" aria-label="Liên kết bộ thẻ">
            <button id="hubShareCopyBtn" class="share-copy-btn" type="button"><i class="fa-regular fa-copy"></i> Sao chép</button>
          </div>
          <div id="hubShareQr" class="share-qr"></div>
          <p class="share-qr-hint">Quét mã QR để mở bộ thẻ trên điện thoại</p>
        </div>
      `;
      document.body.appendChild(modal);

      modal.querySelector("#hubShareClose").addEventListener("click", closeHubShare);
      modal.querySelector("#hubShareCopyBtn").addEventListener("click", copyHubShareLink);
      modal.addEventListener("click", (e) => {
        if (e.target === modal) closeHubShare();
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && modal.classList.contains("show")) closeHubShare();
      });
    })();

    function renderHub(filterValue = "all") {
      currentHubFilter = filterValue;
      hubSections.innerHTML = "";
      const isSingleSection = filterValue !== "all";
      const visibleCardCount = getVisibleCardCount();

      const filtered = sections.filter((section) => filterValue === "all" || section.key === filterValue);

      if (filtered.length === 0) {
        hubSections.innerHTML = `
          <div class="hub-empty">
            <div class="hub-empty-icon">📭</div>
            <h3>Chưa có nội dung</h3>
            <p>Bộ lọc này hiện chưa có flashcard nào. Vui lòng liên hệ Admin để được hỗ trợ và cập nhật nội dung mới nhất.</p>
            <a class="hub-empty-contact" href="mailto:learnhubplatform@gmail.com">
              <i class="fas fa-envelope"></i> Liên hệ Admin
            </a>
          </div>`;
        return;
      }

      filtered
        .forEach((section, sectionIndex) => {
          const block = document.createElement("section");
          block.className = "section-block";
          if (section.theme) {
            block.style.setProperty("--section-accent", section.theme.accent);
            block.style.setProperty("--section-accent-dark", section.theme.accentDark);
            block.style.setProperty("--section-soft", section.theme.soft);
            block.style.setProperty("--section-border", section.theme.border);
            block.style.setProperty("--section-glow", section.theme.glow);
          }
          const shouldSlide = !isSingleSection && section.items.length > visibleCardCount;
          const maxSlide = Math.max(0, section.items.length - visibleCardCount);
          const slideIndex = Math.min(sectionSlides[section.key] || 0, maxSlide);
          sectionSlides[section.key] = slideIndex;

          const header = document.createElement("div");
          header.className = "section-header";
          const statusBadge = getSectionStatusBadge(section);
          // [FIX BUG #6] Fix XSS: build header without innerHTML of user text
          {
            const h2 = document.createElement("h2");
            h2.className = "section-title";
            h2.textContent = section.title || "";
            header.appendChild(h2);
            const actions = document.createElement("div");
            actions.className = "section-actions";
            if (statusBadge) {
              const s = document.createElement("div");
              s.innerHTML = statusBadge;
              actions.appendChild(s);
            }
            if (shouldSlide) {
              const prevBtn = document.createElement("button");
              prevBtn.className = "section-nav prev";
              prevBtn.type = "button";
              prevBtn.setAttribute("aria-label", "Ô trước");
              prevBtn.textContent = "‹";
              actions.appendChild(prevBtn);
            }
            const noteSpan = document.createElement("span");
            noteSpan.className = "section-note";
            noteSpan.textContent = section.note || "";
            actions.appendChild(noteSpan);
            if (shouldSlide) {
              const nextBtn = document.createElement("button");
              nextBtn.className = "section-nav next";
              nextBtn.type = "button";
              nextBtn.setAttribute("aria-label", "Ô sau");
              nextBtn.textContent = "›";
              actions.appendChild(nextBtn);
            }
            header.appendChild(actions);
          }
          block.appendChild(header);

          if (!section.items.length) {
            const empty = document.createElement("p");
            empty.className = "section-empty";
            empty.textContent = "Chưa có bộ từ nào trong nhóm này.";
            block.appendChild(empty);
            hubSections.appendChild(block);
            return;
          }

          const slider = document.createElement("div");
          if (shouldSlide) {
            slider.className = "topic-slider";
            slider.style.setProperty("--slide-index", slideIndex);
          }

          if (shouldSlide) {
            const prevBtn = header.querySelector(".prev");
            const nextBtn = header.querySelector(".next");
            let activeSlide = slideIndex;
            const updateSlide = (nextSlide) => {
              activeSlide = Math.max(0, Math.min(maxSlide, nextSlide));
              sectionSlides[section.key] = activeSlide;
              slider.style.setProperty("--slide-index", activeSlide);
              prevBtn.disabled = activeSlide === 0;
              nextBtn.disabled = activeSlide === maxSlide;
            };

            updateSlide(activeSlide);
            prevBtn.addEventListener("click", () => updateSlide(activeSlide - 1));
            nextBtn.addEventListener("click", () => updateSlide(activeSlide + 1));
          }

          const grid = document.createElement("div");
          grid.className = "topic-grid";

          section.items.forEach((topic) => {
            const isPlaceholder = !topic.href || topic.href === "#";
            const isUnavailable = isPlaceholder || topic.isComplete === false;
            const card = document.createElement("article");
            card.className = "topic-card";
            if (topic.dbSetId) card.dataset.fcDbSet = topic.dbSetId;
            // [FIX BUG #6] Escape user text (name, description, level)
            const topDiv = document.createElement("div");
            topDiv.className = "card-top";
            if (topic.dbSetId && window.__fcHubCanReorder) {
              const grip = document.createElement("span");
              grip.className = "fc-hub-grip";
              grip.draggable = true;
              grip.title = "Giữ và kéo để sắp xếp thứ tự";
              const i = document.createElement("i");
              i.className = "fa-solid fa-grip-vertical";
              grip.appendChild(i);
              topDiv.appendChild(grip);
            }
            if (isUnavailable) {
              const bad = document.createElement("span");
              bad.className = "card-updating-badge";
              bad.textContent = "⏳ Đang cập nhật";
              topDiv.appendChild(bad);
            } else {
              const chip = document.createElement("span");
              chip.className = "chip";
              chip.textContent = topic.level || "Cơ bản";
              topDiv.appendChild(chip);
            }
            const h3 = document.createElement("h3");
            h3.className = "topic-title";
            h3.textContent = topic.name || "";
            const desc = document.createElement("p");
            desc.className = "topic-desc";
            desc.textContent = topic.description || "";
            const meta = document.createElement("div");
            meta.className = "meta";
            const cnt = document.createElement("span");
            cnt.className = "count";
            cnt.textContent = (topic.words || 0) + " mục";
            const btn = document.createElement("button");
            btn.className = "open-btn" + (isUnavailable ? " updating" : "");
            btn.type = "button";
            btn.textContent = isUnavailable ? "⏳ Chờ cập nhật" : "Vào học";

            // Nút chia sẻ đặt ngay cạnh nút "Vào học"
            const actions = document.createElement("div");
            actions.className = "card-actions";
            actions.appendChild(btn);

            if (!isPlaceholder) {
              const shareBtn = document.createElement("button");
              shareBtn.className = "share-btn";
              shareBtn.type = "button";
              shareBtn.title = "Chia sẻ bộ thẻ";
              shareBtn.setAttribute("aria-label", "Chia sẻ bộ thẻ");
              const shareIcon = document.createElement("i");
              shareIcon.className = "fa-solid fa-share-nodes";
              shareIcon.setAttribute("aria-hidden", "true");
              shareBtn.appendChild(shareIcon);
              shareBtn.addEventListener("click", (event) => {
                event.stopPropagation();
                openHubShare(topic);
              });
              actions.appendChild(shareBtn);
            }

            meta.appendChild(cnt);
            meta.appendChild(actions);
            card.appendChild(topDiv);
            card.appendChild(h3);
            card.appendChild(desc);
            card.appendChild(meta);

            card.querySelector(".open-btn").addEventListener("click", () => {
              if (isUnavailable) {
                lhToast("Nội dung đang được cập nhật. Vui lòng quay lại sau!", { type: "warning", title: "Đang cập nhật", icon: "fa-arrows-rotate" });
              } else {
                openLesson(topic);
              }
            });

            card.addEventListener("mouseenter", (event) => setHubBackgroundTheme(section.theme, event));
            card.addEventListener("mousemove", updateHubBackgroundPosition);
            card.addEventListener("mouseleave", clearHubBackgroundTheme);

            grid.appendChild(card);

            if (topic.dbSetId && window.__fcHubCanReorder) {
              const grip = card.querySelector(".fc-hub-grip");
              grip.addEventListener("dragstart", (e) => {
                window.__fcHubDragId = topic.dbSetId;
                card.classList.add("dragging");
                try { e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", topic.dbSetId); } catch (err) {}
              });
              grip.addEventListener("dragend", () => {
                card.classList.remove("dragging");
                grid.querySelectorAll(".topic-card").forEach(x => x.classList.remove("d-over"));
                window.__fcHubDragId = null;
              });
              card.addEventListener("dragover", (e) => {
                if (!card.dataset.fcDbSet || window.__fcHubDragId === topic.dbSetId) return;
                e.preventDefault();
                card.classList.add("d-over");
              });
              card.addEventListener("dragleave", () => card.classList.remove("d-over"));
              card.addEventListener("drop", async (e) => {
                e.preventDefault();
                card.classList.remove("d-over");
                const fromId = window.__fcHubDragId;
                if (!fromId || fromId === topic.dbSetId) return;
                const draggedEl = grid.querySelector(`[data-fc-db-set="${fromId}"]`);
                if (!draggedEl || draggedEl === card) return;
                if (draggedEl !== card.nextElementSibling) card.insertAdjacentElement("afterend", draggedEl);
                const dbCards = [...grid.querySelectorAll(".topic-card[data-fc-db-set]")];
                const ranked = dbCards.map((el, i) => ({ set_id: el.dataset.fcDbSet, position: i }));
                if (typeof window.__fcHubReorder === "function") {
                  const ok = await window.__fcHubReorder(ranked);
                  if (ok) lhToast("Đã lưu thứ tự mới", { type: "success", title: "Sắp xếp" });
                }
              });
            }
          });

          if (shouldSlide) {
            slider.appendChild(grid);
            block.appendChild(slider);
          } else {
            block.appendChild(grid);
          }
          hubSections.appendChild(block);
        });
    }

    filterBtn.addEventListener("click", () => {
      filterRoot.classList.toggle("open");
    });

    // Dùng event delegation để các mục lọc thêm động (nhóm do giáo viên tạo) cũng bấm được
    filterMenu.addEventListener("click", (e) => {
      const item = e.target.closest(".filter-item");
      if (!item) return;
      filterLabel.textContent = item.textContent;
      filterMenu.querySelectorAll(".filter-item").forEach((btn) => btn.classList.remove("active"));
      item.classList.add("active");
      filterRoot.classList.remove("open");
      renderHub(item.dataset.value);
    });

    function addFilterItem(value, label) {
      if (filterMenu.querySelector(`.filter-item[data-value="${value}"]`)) return;
      const li = document.createElement("li");
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "filter-item";
      btn.dataset.value = value;
      btn.textContent = label;
      li.appendChild(btn);
      filterMenu.appendChild(li);
    }

    document.addEventListener("click", (e) => {
      if (!filterRoot.contains(e.target)) {
        filterRoot.classList.remove("open");
      }
    });

    // Chỉ dựng lại khi số thẻ/hàng thật sự đổi (tránh dựng lại + chạy lại animation mỗi lần thanh địa chỉ mobile co giãn)
    let lastVisibleCount = getVisibleCardCount();
    let resizeTimer = null;
    window.addEventListener("resize", () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        const n = getVisibleCardCount();
        if (n === lastVisibleCount) return;
        lastVisibleCount = n;
        renderHub(currentHubFilter);
      }, 150);
    });

    // Hiện skeleton 1 nhịp vẽ trước, sau đó mới dựng lưới thẻ thật (phần nặng: nhiều thẻ + blur + gradient)
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        renderHub();
      });
    });
  </script>

<script>
window.learnHubUser = null;
window.addEventListener('message', function(event) {
  if (event.data && event.data.type === 'LEARNHUB_USER') {
    window.learnHubUser = event.data.user;
  }
  if (event.data && event.data.type === 'DARK_MODE') {
    if (event.data.value) document.body.classList.add('dark-mode');
    else document.body.classList.remove('dark-mode');
  }
});
if (localStorage.getItem("darkMode") === "on") {
  document.body.classList.add("dark-mode");
}
</script>

<script type="module">
  import { supabase, getUserRow, canManageContent, logAppError } from "../../scripts/core/supabase-config.js";

  window.__fcHubReorder = async function(ranked) {
    try {
      const { data, error } = await supabase.rpc("reorder_flashcard_sets", { p_ranked: ranked });
      if (error) throw error;
      return !data || data.ok === true;
    } catch (e) {
      console.error("reorder_flashcard_sets lỗi:", e);
      lhToast("Không lưu được thứ tự: " + (e.message || e), { type: "error", title: "Sắp xếp" });
      return false;
    }
  };

  async function loadTeacherSets() {
    try {
      const [setsRes, groupsRes] = await Promise.all([
        supabase.rpc("list_flashcard_sets"),
        supabase.rpc("list_flashcard_groups")
      ]);
      if (setsRes.error) throw setsRes.error;
      if (typeof window.__hubAddDbSets === "function") window.__hubAddDbSets(setsRes.data || [], groupsRes.data || []);
    } catch (e) {
      console.error("list_flashcard_sets lỗi:", e);
      if (typeof window.__hubLoadError === "function") window.__hubLoadError(e);
      if (typeof logAppError === "function") logAppError({ source: "fc-hub", category: "feature", level: "error", code: "FCHUB_FAIL", message: "list_flashcard_sets thất bại: " + ((e && e.status) ? "[HTTP " + e.status + "]" : "") + " " + ((e && (e.message || e.error_description)) || e), url: location.href });
    }
  }

  (async () => {
    try {
      const { data: { session } } = await supabase.auth.getSession();
      const uid = session && session.user ? session.user.id : null;
      if (uid) {
        const u = await getUserRow(uid);
        if (canManageContent(u?.role)) window.__fcHubCanReorder = true;
      }
    } catch (e) {}
    loadTeacherSets();
  })();
</script>
