<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>tailwind.config = { corePlugins: { preflight: false } };</script>
    <script src="https://cdn.tailwindcss.com"></script>
<title>Xem lại bài làm - LearnHub</title>
    <link rel="icon" href="../../assets/images/favicon.png">
    <link rel="stylesheet" href="../../styles/global.css">
    <link rel="stylesheet" href="../../styles/quiz-review.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
      html, body { min-height: 100%; overflow-anchor: none; }
      html, body { scrollbar-width: none; -ms-overflow-style: none; }
      html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; }
      body { margin: 0; padding: 20px; font-family: Inter, system-ui, sans-serif; color: var(--text); background: var(--bg); background-image: radial-gradient(#d6dcff 1.2px, transparent 1.2px); background-size: 28px 28px; overflow-x: clip; }
      .review-page-container { max-width: 1600px; margin: 0 auto; padding: 0 20px; }
      #review-root { width: 100%; max-width: 100%; }
      .review-question-column { display: flex; flex-direction: column; gap: 25px; }
      .review-summary-card { position: sticky; top: 20px; z-index: 20; }
      #review-root .lh-card { width: 100%; box-sizing: border-box; background: var(--card); border: 1px solid var(--tf-border); border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,.05); }
      .sidebar { position: sticky; top: 20px; align-self: flex-start; height: fit-content; }
      #attempt-back { padding: 0; }
      .lh-stat { border: 1px solid var(--tf-border); border-radius: 12px; }
      .attempt-score { display: flex; align-items: center; justify-content: center; padding: 8px; border-radius: 12px; font: 800 20px/1 Inter, Arial, sans-serif; font-variant-numeric: tabular-nums; }
      .review-content { display: flex; flex-direction: column; gap: 25px; }
      .review-state { padding: 24px; border-radius: 14px; background: var(--card); color: var(--text-sub); text-align: center; font-weight: 700; }
      .at-notice { padding: 12px 14px; border-radius: 10px; background: #fff7ed; color: #9a3412; font-size: .85rem; font-weight: 600; }
      @media (max-width: 1024px) { body { padding: 10px 5px; } .review-page-container { padding: 0; } .sidebar { position: fixed; top: 50%; } }
    </style>
</head>
<body>
<div class="review-page-container">
  <main id="review-root">
    <div class="review-state"><i class="fa-solid fa-circle-notch fa-spin"></i> Đang tải bài làm...</div>
  </main>
</div>
<script type="module">
  import { supabase, escapeHtml } from "../../scripts/core/supabase-config.js";
  import { loadTestAttempt } from "../../scripts/features/learnhub-stats.js";
  import { renderAttemptDetail } from "../../scripts/features/attempt-review-renderer.js";

  const root = document.getElementById("review-root");
  const params = new URLSearchParams(location.search);
  const attemptId = params.get("attempt");
  const studentId = params.get("student");

  try {
    if (localStorage.getItem("darkMode") === "on") document.body.classList.add("dark-mode");
  } catch (_) {}

  function backToReport() {
    if (history.length > 1) history.back();
    else location.href = "../teacher/index.html";
  }
  function scrollToQuestion(index) {
    const card = document.getElementById(`card-${index}`);
    if (!card) return;
    window.scrollTo({ top: card.getBoundingClientRect().top + window.scrollY - 90, behavior: "smooth" });
    if (window.innerWidth <= 1024) toggleSidebar();
  }
  function toggleSidebar() {
    const sidebar = document.getElementById("sidebarNav");
    const overlay = document.getElementById("sidebarOverlay");
    if (!sidebar || !overlay) return;
    const visible = sidebar.style.display === "block";
    sidebar.style.display = visible ? "" : "block";
    overlay.style.display = visible ? "none" : "flex";
  }
  function showError(message) {
    document.title = "Không tìm thấy bài làm - LearnHub";
    root.innerHTML = `<div class="review-state">${escapeHtml(message)}<div style="margin-top:16px"><button id="review-back" class="btn" type="button">Quay lại</button></div></div>`;
    document.getElementById("review-back").addEventListener("click", backToReport);
  }

  window.scrollToQuestion = scrollToQuestion;
  window.toggleSidebar = toggleSidebar;
  root.addEventListener("click", (event) => {
    if (event.target.closest("#attempt-back")) backToReport();
  });

  if (!attemptId) {
    showError("Thiếu thông tin bài làm.");
  } else {
    try {
      let attempt;
      let studentName = "";
      if (studentId) {
        const { data, error } = await supabase.rpc("teacher_report_attempt_detail", {
          p_attempt_id: attemptId,
          p_user_id: studentId
        });
        if (error) throw error;
        attempt = data && data.attempt;
        studentName = data && data.student_name || "Học sinh";
      } else {
        attempt = await loadTestAttempt(attemptId);
      }
      if (!attempt) {
        showError("Không tìm thấy bài làm này.");
      } else {
        const testName = (attempt.paper && attempt.paper.meta && attempt.paper.meta.name) || attempt.test_name || "Bài kiểm tra";
        document.title = testName + " - Xem lại bài";
        root.innerHTML = renderAttemptDetail(attempt, studentName);
      }
    } catch (error) {
      console.error("Tải chi tiết bài làm báo cáo lỗi:", error);
      showError("Không tải được chi tiết bài làm. Hãy quay lại và thử lại.");
    }
  }
</script>
</body>
</html>
