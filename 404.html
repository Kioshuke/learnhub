<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<link rel="icon" href="/pictures/favicon.png" sizes="any">
<title>404 · Trang không tồn tại</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
<link rel="stylesheet" href="element/giaodien.css">
<style>
:root{
  --bg:#f4f7fb;--text:#0f172a;--sub:#64748b;--card:#ffffff;--border:#dbe3ef;
  --blue:#1a73e8;
}

*{box-sizing:border-box;margin:0;padding:0;}
html,body{min-height:100%;}
body{
  font-family:'Inter','Segoe UI',sans-serif;background:var(--bg);color:var(--text);
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:24px;text-align:center;position:relative;overflow:hidden;
}

/* ===== ICON BAY LƠ LỬNG ===== */
.float{
  position:absolute;opacity:.25;pointer-events:none;
  animation:bob 6s ease-in-out infinite;
}
.float.i1{top:12%;left:8%;font-size:56px;color:#1a73e8;}
.float.i2{top:18%;right:10%;font-size:44px;color:#7c3aed;animation-delay:-1.5s;animation-duration:7s;}
.float.i3{bottom:16%;left:12%;font-size:48px;color:#16a34a;animation-delay:-3s;animation-duration:8s;}
.float.i4{bottom:12%;right:9%;font-size:60px;color:#dc2626;animation-delay:-2s;}
.float.i5{top:45%;left:4%;font-size:36px;color:#f59e0b;animation-delay:-4s;animation-duration:9s;}
.float.i6{top:50%;right:5%;font-size:38px;color:#0891b2;animation-delay:-.8s;animation-duration:6.5s;}
@keyframes bob{
  0%,100%{transform:translateY(0) rotate(-6deg);}
  50%{transform:translateY(-18px) rotate(6deg);}
}

/* ===== NỘI DUNG CHÍNH ===== */
main{max-width:520px;position:relative;z-index:1;}
.badge{
  display:inline-flex;align-items:center;gap:7px;background:var(--card);
  border:1px solid var(--border);color:var(--blue);font-weight:700;font-size:13px;
  border-radius:999px;padding:7px 15px;margin-bottom:18px;
  box-shadow:0 4px 14px rgba(15,23,42,.06);
  animation:fadeDown .5s ease .05s both;
}
.code{
  font-size:clamp(110px,30vw,190px);font-weight:900;line-height:.95;letter-spacing:-.05em;
  background:linear-gradient(135deg,#1a73e8 10%,#7c3aed 55%,#dc2626 95%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 14px 32px rgba(26,115,232,.22));
  animation:pop .7s cubic-bezier(.22,1.4,.36,1) both;
}
@keyframes pop{
  from{transform:scale(.7);opacity:0;}
  to{transform:scale(1);opacity:1;}
}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:none;}}
@keyframes fadeDown{from{opacity:0;transform:translateY(-12px);}to{opacity:1;transform:none;}}
@keyframes fadeLeft{from{opacity:0;transform:translateX(-18px);}to{opacity:1;transform:none;}}
/* ===== HUBIE NÓI CHUYỆN ===== */
.hubie-row{display:flex;align-items:flex-start;gap:12px;margin-top:62px;text-align:left;}
.hubie-avt{
  width:60px;height:60px;flex-shrink:0;border-radius:50%;object-fit:cover;
  border:3px solid var(--blue);box-shadow:0 8px 22px rgba(26,115,232,.35);
  animation:fadeLeft .5s ease .2s both, bob 5s ease-in-out 1.2s infinite;
}
.hubie-name{font-size:11px;font-weight:700;color:var(--sub);margin-bottom:5px;}
.hubie-name i{color:var(--blue);margin-right:3px;}
.bubble{
  position:relative;background:var(--card);border:1px solid var(--border);
  border-radius:14px;padding:11px 15px;font-size:13.5px;line-height:1.65;color:var(--text);
  box-shadow:0 8px 24px rgba(15,23,42,.08);
  animation:pop .55s cubic-bezier(.22,1.4,.36,1) .25s both;
}
.bubble::before{
  content:"";position:absolute;left:-5.5px;top:20px;width:10px;height:10px;
  background:var(--card);border-left:1px solid var(--border);border-bottom:1px solid var(--border);
  transform:rotate(45deg);
}
.bubble b{color:var(--blue);}

.btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:28px;}
.btn{
  display:inline-flex;align-items:center;gap:9px;text-decoration:none;
  font-weight:700;font-size:14px;border-radius:12px;padding:12px 22px;
  transition:transform .15s ease,box-shadow .15s ease,background .15s ease;
  margin:0;
}
.btn.primary{
  background:linear-gradient(135deg,#1a73e8,#1557b0);color:#fff;
  box-shadow:0 8px 20px rgba(26,115,232,.35);
  animation:fadeUp .5s ease .5s both;
}
.btn.primary:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(26,115,232,.45);}
.btn.ghost{
  background:var(--card);color:var(--text);border:1px solid var(--border);
  box-shadow:0 4px 12px rgba(15,23,42,.05);
  animation:fadeUp .5s ease .65s both;
}
.btn.ghost:hover{transform:translateY(-2px);border-color:var(--blue);color:var(--blue);}

.hint{margin-top:22px;font-size:11.5px;color:var(--sub);opacity:.8;animation:fadeIn .6s ease 1s both;}
.countdown{margin-top:16px;font-size:13px;color:var(--sub);animation:fadeIn .6s ease .85s both;}
.countdown i{margin-right:4px;color:var(--blue);}
.countdown b{color:var(--blue);font-weight:800;font-size:15px;}
.countdown a{color:var(--blue);font-weight:700;text-decoration:none;border-bottom:1.5px dashed currentColor;margin-left:2px;}
.countdown a:hover{opacity:.75;}

@media(max-width:560px){
  .float.i5,.float.i6{display:none;}
  .float.i1,.float.i3{font-size:38px;}
  .btns .btn{width:100%;justify-content:center;}
  .hubie-avt{width:46px;height:46px;}
}

/* ===== RADAR NỀN — HUBIE QUÉT ===== */
.radar-bg{
  position:fixed;inset:0;z-index:0;
  display:flex;align-items:center;justify-content:center;
  opacity:.55;pointer-events:none;
  --green:#35f28a;--green-light:#8affbd;--red:#ff4545;
}
.radar-bg .radar-wrapper{position:relative;width:690px;height:690px;display:flex;align-items:center;justify-content:center;}
.outer-glow{
  position:absolute;width:690px;height:690px;border-radius:50%;
  border:1px solid rgba(53,242,138,.12);
  box-shadow:0 0 50px rgba(53,242,138,.08),inset 0 0 40px rgba(53,242,138,.04);
}
.outer-ring{
  position:absolute;width:675px;height:675px;border-radius:50%;
  border:2px solid rgba(53,242,138,.65);
  box-shadow:0 0 15px rgba(53,242,138,.2);
}
.radar{
  position:relative;width:640px;height:640px;border-radius:50%;overflow:hidden;
  background:none;
  border:1px solid rgba(53,242,138,.5);
  box-shadow:none;
}
.radar::before{
  content:"";position:absolute;inset:0;z-index:30;pointer-events:none;
  background:repeating-linear-gradient(0deg,transparent 0px,transparent 3px,rgba(53,242,138,.025) 4px);
}
.range{position:absolute;border-radius:50%;border:1px solid rgba(53,242,138,.24);pointer-events:none;}
.r1{inset:10%;}
.r2{inset:22%;}
.r3{inset:34%;}
.r4{inset:46%;}
.r5{inset:58%;}
.r6{inset:70%;}
.axis{position:absolute;inset:0;pointer-events:none;}
.axis::before,.axis::after{content:"";position:absolute;background:rgba(53,242,138,.25);}
.axis::before{width:1px;height:100%;left:50%;top:0;}
.axis::after{width:100%;height:1px;left:0;top:50%;}
.diagonal{position:absolute;inset:0;pointer-events:none;}
.diagonal::before,.diagonal::after{content:"";position:absolute;width:1px;height:100%;left:50%;top:0;background:rgba(53,242,138,.08);transform-origin:center;}
.diagonal::before{transform:rotate(45deg);}
.diagonal::after{transform:rotate(-45deg);}
.ticks{
  position:absolute;inset:0;border-radius:50%;pointer-events:none;
  background:repeating-conic-gradient(from 0deg,rgba(53,242,138,.5) 0deg .7deg,transparent .7deg 6deg);
  -webkit-mask:radial-gradient(circle,transparent 0%,transparent 92%,#000 92.2%,#000 100%);
  mask:radial-gradient(circle,transparent 0%,transparent 92%,#000 92.2%,#000 100%);
}
.cardinal-ticks{position:absolute;inset:0;pointer-events:none;}
.cardinal-ticks span{position:absolute;background:var(--green);box-shadow:0 0 6px rgba(53,242,138,.7);}
.cardinal-ticks .top,.cardinal-ticks .bottom{width:2px;height:12px;left:calc(50% - 1px);}
.cardinal-ticks .top{top:3px;}
.cardinal-ticks .bottom{bottom:3px;}
.cardinal-ticks .left,.cardinal-ticks .right{width:12px;height:2px;top:calc(50% - 1px);}
.cardinal-ticks .left{left:3px;}
.cardinal-ticks .right{right:3px;}
.sweep{
  position:absolute;inset:-1px;border-radius:50%;z-index:5;pointer-events:none;
  background:conic-gradient(from 0deg,transparent 0deg,transparent 320deg,rgba(53,242,138,.015) 328deg,rgba(53,242,138,.025) 335deg,rgba(53,242,138,.05) 342deg,rgba(53,242,138,.09) 348deg,rgba(53,242,138,.17) 353deg,rgba(53,242,138,.3) 357deg,rgba(138,255,189,.7) 359deg,rgba(138,255,189,.85) 360deg);
  animation:radarSpin 4s linear infinite;
  filter:drop-shadow(0 0 7px rgba(53,242,138,.65));
}
@keyframes radarSpin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
.target{
  position:absolute;width:24px;height:24px;
  transform:translate(-50%,-50%) scale(.7);
  z-index:10;opacity:0;
  animation:targetAppear 4s infinite;
  color:var(--green);
}
.target::before{content:"";position:absolute;width:34px;height:1px;left:-5px;top:11px;background:currentColor;opacity:.7;}
.target::after{content:"";position:absolute;width:1px;height:34px;left:11px;top:-5px;background:currentColor;opacity:.7;}
.target-box{position:absolute;inset:3px;border:1px solid rgba(53,242,138,.8);box-shadow:0 0 7px rgba(53,242,138,.25);}
.target-dot{position:absolute;width:6px;height:6px;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;background:var(--green-light);box-shadow:0 0 6px var(--green),0 0 14px rgba(53,242,138,.8);}
.target.danger{color:var(--red);}
.target.danger .target-box{border-color:rgba(255,69,69,.95);box-shadow:0 0 9px rgba(255,69,69,.35);}
.target.danger .target-dot{background:var(--red);box-shadow:0 0 6px var(--red),0 0 15px rgba(255,69,69,.8);}
.target-1{left:66%;top:29%;animation-delay:.4s;}
.target-2{left:40%;top:22%;animation-delay:2.2s;}
.target-3{left:43%;top:38%;animation-delay:1.1s;}
.target-4{left:23%;top:52%;animation-delay:3.1s;}
.target-5{left:38%;top:69%;animation-delay:2.7s;}
.target-6{left:73%;top:72%;animation-delay:1.8s;}
@keyframes targetAppear{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.6);}
  7%{opacity:1;transform:translate(-50%,-50%) scale(1.15);}
  13%{opacity:1;transform:translate(-50%,-50%) scale(1);}
  32%{opacity:.8;}
  45%{opacity:0;}
  100%{opacity:0;}
}
.center{position:absolute;width:20px;height:20px;left:50%;top:50%;transform:translate(-50%,-50%);z-index:15;border-radius:50%;border:1px solid rgba(53,242,138,.8);box-shadow:0 0 8px rgba(53,242,138,.45);}
.center::before{content:"";position:absolute;width:6px;height:6px;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;background:var(--green-light);box-shadow:0 0 7px var(--green),0 0 15px rgba(53,242,138,.75);}
@media(max-width:620px){.radar-bg .radar-wrapper{transform:scale(.8);}}
@media(max-width:480px){.radar-bg .radar-wrapper{transform:scale(.65);}}
/* Giảm chuyển động: radar đứng yên */
body.cc-reduced .radar-bg .sweep{animation:none!important;}
body.cc-reduced .radar-bg .target{animation:none;opacity:0;}
/* ===== TOAST "BÀI TEST KHÔNG TỒN TẠI" (khi tới từ deep link ?open=phong-hoc&de=...) ===== */
.lh-404-toast{
  position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:9999;
  max-width:min(92vw,560px);display:flex;align-items:flex-start;gap:11px;
  background:var(--card);border:1px solid var(--border);border-left:4px solid #dc2626;
  border-radius:12px;padding:13px 16px;box-shadow:0 10px 32px rgba(15,23,42,.18);
  font-size:13.5px;line-height:1.55;color:var(--text);text-align:left;
  animation:toastIn .35s cubic-bezier(.22,1.4,.36,1) both;
}
.lh-404-toast .ic{color:#dc2626;font-size:17px;margin-top:1px;}
.lh-404-toast b{display:block;color:var(--text);margin-bottom:2px;}
.lh-404-toast code{
  display:inline-block;background:rgba(220,38,38,.08);color:#dc2626;
  border-radius:6px;padding:0 6px;font-family:monospace;font-size:12px;
}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,-14px);}to{opacity:1;transform:translate(-50%,0);}}
/* Đẩy main xuống khi hiện toast để không bị che chữ badge "Lỗi 404" */
body.lh-has-toast main{padding-top:88px;}
</style>
</head>
<body>

<div class="radar-bg" aria-hidden="true">
    <div class="radar-wrapper">
        <div class="outer-glow"></div>
        <div class="outer-ring"></div>
        <div class="radar">
            <div class="range r1"></div>
            <div class="range r2"></div>
            <div class="range r3"></div>
            <div class="range r4"></div>
            <div class="range r5"></div>
            <div class="range r6"></div>
            <div class="axis"></div>
            <div class="diagonal"></div>
            <div class="ticks"></div>
            <div class="cardinal-ticks">
                <span class="top"></span>
                <span class="right"></span>
                <span class="bottom"></span>
                <span class="left"></span>
            </div>
            <div class="sweep"></div>
            <div class="target danger target-1">
                <div class="target-box"></div>
                <div class="target-dot"></div>
            </div>
            <div class="target target-2">
                <div class="target-box"></div>
                <div class="target-dot"></div>
            </div>
            <div class="target target-3">
                <div class="target-box"></div>
                <div class="target-dot"></div>
            </div>
            <div class="target target-4">
                <div class="target-box"></div>
                <div class="target-dot"></div>
            </div>
            <div class="target target-5">
                <div class="target-box"></div>
                <div class="target-dot"></div>
            </div>
            <div class="target target-6">
                <div class="target-box"></div>
                <div class="target-dot"></div>
            </div>
            <div class="center"></div>
        </div>
    </div>
</div>

<script>
/* Dark mode theo cài đặt chung của site (localStorage, giống các trang khác) */
if (localStorage.getItem("darkMode") === "on") document.body.classList.add("dark-mode");
window.addEventListener("storage", function (e) {
  if (e.key === "darkMode") document.body.classList.toggle("dark-mode", e.newValue === "on");
});
/* Giảm chuyển động theo cài đặt chung của site (cc_reduce) */
if (localStorage.getItem("cc_reduce") === "on") document.body.classList.add("cc-reduced");
window.addEventListener("storage", function (e) {
  if (e.key === "cc_reduce") document.body.classList.toggle("cc-reduced", e.newValue === "on");
});
</script>

<i class="fas fa-book float i1"></i>
<i class="fas fa-pencil float i2"></i>
<i class="fas fa-flask float i3"></i>
<i class="fas fa-graduation-cap float i4"></i>
<i class="fas fa-calculator float i5"></i>
<i class="fas fa-lightbulb float i6"></i>

<main>
  <span class="badge"><i class="fas fa-compass"></i> Lỗi 404 · Không tìm thấy trang</span>
  <div class="code">404</div>
  <div class="hubie-row">
    <img class="hubie-avt" src="/pictures/chatboiavt.png" alt="Hubie">
    <div class="hubie-col">
      <div class="hubie-name"><i class="fas fa-robot"></i> Hubie · Trợ lý LearnHub</div>
      <div class="bubble">Huhu trang này mình lùng suốt cũng <b>không thấy đâu</b> hết trơn á! 🥲<br>Thui để mình chỉ đường đưa bạn về chỗ học nha! 👉</div>
    </div>
  </div>
  <div class="btns">
    <a class="btn primary" href="/index.html"><i class="fas fa-house"></i> Về trang chủ</a>
    <a class="btn ghost" href="/index.html?open=phong-hoc"><i class="fas fa-book-open"></i> Vào phòng học</a>
  </div>
  <div class="countdown"><i class="fas fa-hourglass-half"></i> Tự động về trang chủ sau <b id="cdNum">30</b>s · <a href="/index.html">Về ngay</a></div>
  <div class="hint">LearnHub Platform · Nền tảng học tập trực tuyến</div>
</main>

<script>
/* Đếm ngược 30s tự về trang chủ */
(function () {
  var n = 30;
  var el = document.getElementById("cdNum");
  var iv = setInterval(function () {
    n--;
    if (n <= 0) { clearInterval(iv); window.location.replace("/index.html"); return; }
    if (el) el.textContent = n;
  }, 1000);
})();
</script>

<script>
/* Toast khi tới từ deep link bài test hỏng (?open=phong-hoc&de=...) */
(function () {
  var de = new URLSearchParams(window.location.search).get("de");
  if (!de) return;
  var t = document.createElement("div");
  t.className = "lh-404-toast";
  t.innerHTML =
    '<span class="ic"><i class="fa-solid fa-triangle-exclamation"></i></span>' +
    '<span><b>Bài test không tồn tại hoặc đã bị xóa</b>' +
    'Không tìm thấy bài test <code>' + de.replace(/[$&`"'<>]/g, "") + '</code>. ' +
    'Có thể nó đã bị đổi tên hoặc gỡ xuống. Bạn hãy vào phòng học để chọn bài khác nhé!</span>' +
    '<button type="button" aria-label="Đóng" style="background:none;border:none;cursor:pointer;color:var(--sub);font-size:14px;margin-left:auto;padding:0 0 0 8px;" onclick="this.parentNode.remove()"><i class="fa-solid fa-xmark"></i></button>';
  document.body.appendChild(t);
  document.body.classList.add("lh-has-toast");
  setTimeout(function () {
    if (t.parentNode) t.remove();
    document.body.classList.remove("lh-has-toast");
  }, 10000);
})();
</script>

</body>
</html>
