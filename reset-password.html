<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đặt lại mật khẩu - LearnHub Platform</title>
<link rel="icon" href="pictures/favicon.png" sizes="any">
<link rel="icon" type="image/png" sizes="48x48" href="pictures/favicon.png">
<meta name="theme-color" content="#1a73e8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" media="print" onload="this.media='all'">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#f6f8ff;
    padding:24px;
    -webkit-font-smoothing:antialiased;
    color:#1e293b;
    overflow-x:hidden;
    scrollbar-width:none;
  }
  body::-webkit-scrollbar{width:0;height:0}

  /* ===== BLOBS NỀN ===== */
  .bg-blobs{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
  .bg-blobs span{position:absolute;border-radius:50%;filter:blur(48px);opacity:.18;animation:floaty 14s ease-in-out infinite alternate}
  .bg-blobs span:nth-child(1){width:260px;height:260px;background:#c7d2fe;top:-80px;left:-80px}
  .bg-blobs span:nth-child(2){width:200px;height:200px;background:#c7d2fe;bottom:-70px;right:-70px;animation-delay:4s}
  @keyframes floaty{from{transform:translateY(0) scale(1)}to{transform:translateY(24px) scale(1.06)}}

  .rp-card{
    position:relative;
    z-index:1;
    width:min(94vw,430px);
    background:#fff;
    border-radius:22px;
    box-shadow:0 24px 60px rgba(2,6,23,.10),0 2px 8px rgba(2,6,23,.03);
    padding:30px 30px 28px;
    border:1px solid #e2e8f0;
  }

  /* ===== HEADER (badge + tiêu đề cùng hàng) ===== */
  .rp-head{display:flex;align-items:center;gap:13px;margin-bottom:24px}
  .rp-badge{
    width:46px;height:46px;flex-shrink:0;
    border-radius:14px;
    background:#2563eb;
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:18px;
    box-shadow:0 8px 18px rgba(37,99,235,.28);
  }
  .rp-head h2{font-size:20px;font-weight:900;letter-spacing:-.02em;line-height:1.2;color:#2563eb}
  .rp-sub{margin-top:3px;font-size:12.5px;color:#64748b;font-weight:500;line-height:1.5}

  /* ===== FIELDS ===== */
  .rp-field{text-align:left;margin-bottom:16px}
  .rp-field label{display:block;font-size:12px;font-weight:700;color:#475569;margin-bottom:7px;letter-spacing:.02em}
  .rp-field label .req{color:#ef4444}
  .rp-input-wrap{position:relative}
  .rp-field input{
    width:100%;padding:12px 42px 12px 14px;border-radius:12px;
    border:1px solid #e2e8f0;outline:none;font-size:14px;color:#1e293b;
    transition:border-color .18s ease,box-shadow .18s ease;font-family:inherit;
    background:#fff;
  }
  .rp-field input::placeholder{color:#a0aec0}
  .rp-field input:focus{border-color:#2563eb;box-shadow:0 0 0 4px rgba(37,99,235,.14)}
  .rp-eye{
    position:absolute;right:6px;top:50%;transform:translateY(-50%);
    width:32px;height:32px;border:none;background:transparent;cursor:pointer;
    color:#94a3b8;font-size:14px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;
    transition:color .15s ease,background-color .15s ease;
  }
  .rp-eye:hover{color:#2563eb;background:#eff6ff}

  /* ===== SUBMIT ===== */
  .rp-btn{
    width:100%;padding:13px;border:none;border-radius:12px;
    background:#2563eb;color:#fff;
    font-size:14.5px;font-weight:700;cursor:pointer;font-family:inherit;
    box-shadow:0 8px 20px rgba(37,99,235,.28);
    transition:transform .15s ease,box-shadow .15s ease,background-color .15s ease;
    display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .rp-btn:hover{transform:translateY(-1px);box-shadow:0 12px 26px rgba(37,99,235,.4);background:#1d4ed8}
  .rp-btn:active{transform:translateY(0)}
  .rp-btn:disabled{opacity:.6;cursor:not-allowed;transform:none}

  /* ===== LOADING / MESSAGE ===== */
  .rp-loading{
    color:#94a3b8;font-size:14px;font-weight:500;
    padding:20px 0;display:flex;align-items:center;justify-content:center;gap:9px;
  }
  .rp-link{
    display:inline-block;margin-top:16px;color:#2563eb;
    font-size:13px;font-weight:600;text-decoration:none;
    transition:opacity .15s ease;
  }
  .rp-link:hover{opacity:.8;text-decoration:underline}
</style>
<script src="version/version-check.js" defer></script>
<script src="toast.js"></script>
</head>
<body>

<div class="bg-blobs"><span></span><span></span></div>

<div class="rp-card">
  <div class="rp-head">
    <div class="rp-badge"><i class="fa-solid fa-key"></i></div>
    <div>
      <h2>Đặt lại mật khẩu</h2>
      <p class="rp-sub">Nhập mật khẩu mới cho tài khoản LearnHub của bạn.</p>
    </div>
  </div>

  <div id="rpFormWrap" style="display:none">
    <form id="rpForm" novalidate>
      <div class="rp-field">
        <label>Mật khẩu mới <span class="req">*</span></label>
        <div class="rp-input-wrap">
          <input type="password" id="rpPassword" autocomplete="new-password" required>
          <button type="button" class="rp-eye" onclick="togglePw('rpPassword', this)"><i class="fa-solid fa-eye"></i></button>
        </div>
      </div>
      <div class="rp-field">
        <label>Nhập lại mật khẩu mới <span class="req">*</span></label>
        <div class="rp-input-wrap">
          <input type="password" id="rpConfirm" autocomplete="new-password" required>
          <button type="button" class="rp-eye" onclick="togglePw('rpConfirm', this)"><i class="fa-solid fa-eye"></i></button>
        </div>
      </div>
      <button type="submit" class="rp-btn" id="rpSubmitBtn">
        <i class="fa-solid fa-arrow-rotate-right"></i> Cập nhật mật khẩu
      </button>
    </form>
  </div>

<div id="rpStatus" class="rp-loading"><i class="fa-solid fa-spinner fa-spin"></i> Đang kiểm tra liên kết...</div>
<a class="rp-link" href="login.html" id="rpBackLogin" style="display:none">&larr; Quay lại đăng nhập</a>
</div>

<script>
  window.togglePw = function(id, btn) {
    const input = document.getElementById(id);
    if (!input) return;
    const show = input.type === 'password';
    input.type = show ? 'text' : 'password';
    const icon = btn.querySelector('i');
    if (icon) icon.className = show ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye';
  };
</script>

<script type="module">
import { supabase } from "./supabase-config.js";
import { finalizeOnlineSession } from "./supabase-helpers.js";

const PENDING_RESET_KEY = "learnhub-pending-reset";
const formWrap = document.getElementById("rpFormWrap");
const statusEl = document.getElementById("rpStatus");
const backLink = document.getElementById("rpBackLogin");
const passwordInput = document.getElementById("rpPassword");
const confirmInput = document.getElementById("rpConfirm");
const submitBtn = document.getElementById("rpSubmitBtn");

let shown = false;

function showMessage(text, type = "error") {
  if (window.lhToast) {
    lhToast(text, { type: type === "info" ? "info" : type });
  }
  backLink.style.display = "inline-block";
}

function showInvalid() {
  statusEl.style.display = "none";
  showMessage(
    "Liên kết đặt lại mật khẩu không hợp lệ hoặc đã hết hạn. Vui lòng yêu cầu lại liên kết từ màn hình đăng nhập.",
    "error"
  );
}

function reveal() {
  if (shown) return;
  shown = true;
  statusEl.style.display = "none";
  formWrap.style.display = "block";
  setTimeout(() => passwordInput.focus(), 100);
}

function isExpiredLink(hash) {
  try {
    const params = new URLSearchParams(hash.substring(1));
    if (params.get("type") !== "recovery") return false;
    const expiresAt = parseInt(params.get("expires_at"), 10);
    if (!isNaN(expiresAt) && Date.now() / 1000 > expiresAt) return true;
    return false;
  } catch (e) {
    return false;
  }
}

// 1) Link email mở trực tiếp trang này (#...type=recovery) -> phát hiện sớm từ URL.
const hasRecoveryHash =
  /(^|[?&#;])type=recovery([&#;]|$)/i.test(window.location.hash) &&
  /access_token=/.test(window.location.hash);

if (hasRecoveryHash) {
  if (isExpiredLink(window.location.hash)) {
    showInvalid();
  } else {
    reveal();
  }
}

// Dự phòng: sự kiện PASSWORD_RECOVERY từ supabase-js (sau khi xử lý hash).
supabase.auth.onAuthStateChange((event) => {
  if (event === "PASSWORD_RECOVERY") {
    try { sessionStorage.removeItem(PENDING_RESET_KEY); } catch (e) {}
    reveal();
  }
});

// 2) Link mở ở web chính (index/login) rồi chuyển sang đây kèm cờ "đang đợi".
async function checkHandoff() {
  let pending = false;
  try { pending = sessionStorage.getItem(PENDING_RESET_KEY) === "1"; } catch (e) {}
  try { sessionStorage.removeItem(PENDING_RESET_KEY); } catch (e) {}
  if (!pending) return false;

  const { data } = await supabase.auth.getSession();
  if (data && data.session) {
    reveal();
    return true;
  }
  showInvalid();
  return true;
}

(async () => {
  if (await checkHandoff()) return;
  if (hasRecoveryHash || shown) return;
  setTimeout(() => {
    if (!shown) showInvalid();
  }, 5000);
})();

// Xử lý nút "Cập nhật mật khẩu".
document.getElementById("rpForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const newPassword = passwordInput.value;
  const confirmPassword = confirmInput.value;

  if (newPassword.length < 6) {
    showMessage("Mật khẩu mới phải có ít nhất 6 ký tự.");
    return;
  }
  if (newPassword !== confirmPassword) {
    showMessage("Mật khẩu nhập lại không khớp.");
    return;
  }

  submitBtn.disabled = true;
  submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Đang cập nhật...';
  try {
    const { error } = await supabase.auth.updateUser({ password: newPassword });
    if (error) throw error;
    passwordInput.value = "";
    confirmInput.value = "";
    formWrap.style.display = "none";
    showMessage("Đặt lại mật khẩu thành công! Đang chuyển đến đăng nhập...", "success");
    setTimeout(async () => {
      try { const { data } = await supabase.auth.getUser(); if (data?.user?.id) await finalizeOnlineSession(data.user.id); } catch (e) {}
      await supabase.auth.signOut().catch(() => {});
      window.location.replace("login.html");
    }, 2000);
  } catch (error) {
    console.error("Đặt lại mật khẩu lỗi:", error);
    showMessage("Đặt lại mật khẩu thất bại: " + error.message);
  } finally {
    submitBtn.disabled = false;
    submitBtn.innerHTML = '<i class="fa-solid fa-arrow-rotate-right"></i> Cập nhật mật khẩu';
  }
});
</script>
</body>
</html>
