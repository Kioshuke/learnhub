<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LearnHub Forum</title>
  <link rel="icon" href="../pictures/favicon.png" sizes="any">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="giaodien.css">

<style>
:root{
  --primary:#2563eb;
  --primary-dark:#1d4ed8;
  --accent:#14b8a6;
  --bg:#f4f7fb;
  --surface:#ffffff;
  --surface-soft:#f8fafc;
  --text:#111827;
  --sub:#667085;
  --muted:#98a2b3;
  --line:#e6eaf0;
  --line-strong:#d9e2ec;
  --success:#10b981;
  --danger:#ef4444;
  --shadow:0 6px 18px rgba(16, 24, 40, 0.07);
  --shadow-soft:0 2px 9px rgba(16, 24, 40, 0.055);
}

* { box-sizing: border-box; }

html { background: var(--bg); overflow-x: hidden; }

body {
  min-height: 100vh;
  max-width: 100vw;
  overflow-x: hidden;
  margin: 0;
  color: var(--text);
  font-family: 'Segoe UI', Arial, sans-serif;
  font-weight: 400;
  letter-spacing: 0;
  background:
    linear-gradient(180deg, rgba(255,255,255,0.86), rgba(244,247,251,0.96)),
    radial-gradient(circle at 18% 0%, rgba(37,99,235,0.12), transparent 26%),
    radial-gradient(circle at 92% 10%, rgba(20,184,166,0.12), transparent 24%);
}

.container {
  width: min(100%, 1400px);
  max-width: 100vw;
  margin: 0 auto;
  padding: 12px 14px 18px;
}

.header {
  position: sticky;
  top: 10px;
  z-index: 15;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 14px;
  min-height: 52px;
  margin-bottom: 7px;
  padding: 9px 12px;
  color: #fff;
  background: linear-gradient(135deg, #1d4ed8, #0f766e);
  border: 1px solid rgba(255,255,255,0.24);
  border-radius: 14px;
  box-shadow: 0 8px 22px rgba(29,78,216,0.16);
  overflow: hidden;
}

.header::after {
  content: "";
  position: absolute;
  inset: auto -30px -48px auto;
  width: 180px;
  height: 180px;
  border-radius: 50%;
  background: rgba(255,255,255,0.13);
  pointer-events: none;
}

.logo {
  position: relative;
  min-width: 0;
  white-space: nowrap;
  z-index: 1;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 16px;
  font-weight: 600;
  letter-spacing: 0;
}

.user-box {
  position: relative;
  z-index: 1;
  display: inline-flex;
  align-items: center;
  gap: 9px;
  min-width: 0;
  max-width: 48%;
  min-height: 32px;
  padding: 3px 9px 3px 3px;
  color: #f8fafc;
  background: rgba(255,255,255,0.16);
  border: 1px solid rgba(255,255,255,0.28);
  border-radius: 999px;
  font-size: 13px;
  font-weight: 500;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.18);
  overflow: hidden;
  white-space: nowrap;
}

.user-name-current.admin-name {
  color: #dc2626;
  font-weight: 900;
}

.user-box .user-avatar.admin {
  background: linear-gradient(135deg,#dc2626,#b91c1c);
  color: #fff;
  box-shadow: 0 6px 14px rgba(220,38,38,0.18);
}

.user-avatar {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 24px;
  height: 24px;
  flex: 0 0 auto;
  border-radius: 50%;
  color: #164e63;
  background: #ffffff;
  font-size: 13px;
  font-weight: 800;
  box-shadow: 0 6px 14px rgba(15,23,42,0.18);
}

.user-name-current {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
}

.post-box {
  margin-bottom: 7px;
  padding: 10px;
  background: rgba(255,255,255,0.94);
  border: 1px solid var(--line);
  border-radius: 14px;
  box-shadow: var(--shadow);
}

textarea {
  width: 100%;
  min-height: 74px;
  padding: 7px 10px;
  color: #172033;
  background: #f9fbfe;
  border: 1px solid var(--line-strong);
  border-radius: 12px;
  outline: none;
  resize: none;
  overflow: hidden;
  font: 500 14px/1.5 'Be Vietnam Pro', 'Inter', 'Segoe UI', sans-serif;
  transition: border-color 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
}

textarea:focus {
  background: #fff;
  border-color: rgba(37,99,235,0.58);
  box-shadow: 0 0 0 4px rgba(37,99,235,0.11);
}

textarea::placeholder { color: #98a2b3; font-style: normal; }

.char-counter {
  margin-top: 3px;
  color: var(--muted);
  text-align: right;
  font-size: 12px;
  font-weight: 500;
}

.post-actions-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-top: 6px;
}

.actions-left {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}

.actions-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: 1 1 auto;
  min-width: 0;
  justify-content: flex-end;
}

button {
  margin-top: 0;
  padding: 8px 13px;
  border: 0;
  border-radius: 999px;
  color: #fff;
  background: linear-gradient(135deg, var(--primary), #0f766e);
  box-shadow: 0 8px 18px rgba(37,99,235,0.22);
  cursor: pointer;
  font-weight: 500;
  transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
}

button:hover { transform: translateY(-1px); filter: brightness(1.03); box-shadow: 0 12px 22px rgba(37,99,235,0.26); }
button:active { transform: translateY(0); }

.post-submit { min-width: 80px; padding: 7px 14px; font-size: 13px; }
.mute-btn { margin-left: 0; min-width: auto; padding: 7px 12px; font-size: 12px; background: #475467 !important; box-shadow: 0 6px 14px rgba(71,84,103,0.18); white-space: nowrap; }
.mute-btn:hover { background: #344054 !important; }

.composer-input-wrap { position: relative; }
.composer-input-wrap textarea { padding-right: 86px; }
.composer-tools { position: absolute; right: 8px; bottom: 8px; display: flex; align-items: center; gap: 6px; z-index: 5; }
.icon-btn { width: 30px; height: 30px; padding: 0; display: inline-flex; align-items: center; justify-content: center; border-radius: 8px; font-size: 14px; line-height: 1; background: #fff; border: 1px solid var(--line-strong); color: #475467; box-shadow: 0 2px 6px rgba(16,24,40,0.08); cursor: pointer; transition: background 0.18s ease, transform 0.18s ease; }
.icon-btn:hover { background: #f2f6fc; transform: translateY(-1px); }
.icon-btn:active { transform: translateY(0); }

.image-preview { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.image-preview-item { position: relative; width: 84px; height: 84px; border-radius: 10px; overflow: hidden; border: 1px solid var(--line-strong); }
.image-preview-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
.image-preview-remove { position: absolute; top: 3px; right: 3px; width: 20px; height: 20px; border-radius: 50%; background: rgba(15,23,42,.65); color: #fff; font-size: 11px; line-height: 20px; text-align: center; cursor: pointer; }

.post-image-wrap { margin-top: 8px; }
.post-image { max-width: 100%; max-height: 480px; border-radius: 10px; border: 1px solid var(--line); cursor: zoom-in; display: block; }

.post {
  position: relative;
  margin-bottom: 8px;
  padding: 10px 12px 8px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  box-shadow: var(--shadow-soft);
  transition: border-color 0.18s ease, box-shadow 0.18s ease, transform 0.18s ease;
  overflow: visible;
}

.post:hover {
  transform: translateY(-1px);
  border-color: #d8e2ee;
  box-shadow: 0 8px 18px rgba(16,24,40,0.08);
}

.post.current-user-post {
  border-color: rgba(37,99,235,0.34);
  box-shadow: 0 12px 30px rgba(37,99,235,0.12);
}

.post.current-user-post::before {
  content: "Bài của bạn";
  position: absolute;
  top: 9px;
  right: 10px;
  padding: 2px 7px;
  color: #175cd3;
  background: #eff8ff;
  border: 1px solid #b2ddff;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 500;
}

/* ================= CSS HIỂN THỊ NỔI BẬT ADMIN ================= */
.post.admin-post-card {
  border: 1px solid rgba(239, 68, 68, 0.45) !important;
  background: linear-gradient(180deg, #fffcfc 0%, #ffffff 100%) !important;
  box-shadow: 0 6px 20px rgba(239, 68, 68, 0.08) !important;
}
.post.admin-post-card::after {
  content: '';
  position: absolute;
  left: 0;
  top: 14px;
  bottom: 14px;
  width: 4px;
  background: var(--danger);
  border-radius: 0 4px 4px 0;
}
.meta .admin-badge {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  background: #fee2e2 !important;
  color: #dc2626 !important;
  font-size: 11px;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 999px;
  margin-left: 6px;
  border: 1px solid rgba(220, 38, 38, 0.25);
}

.meta {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 7px;
  min-height: 20px;
  margin-bottom: 2px;
  padding-right: 72px;
  color: var(--sub);
  font-size: 12.5px;
  font-weight: 500;
}

.meta b {
  color: #175cd3;
  font-weight: 700;
  font-size: 13.5px;
}

.meta b.admin-name {
  color: #dc2626 !important;
  font-weight: 800 !important;
}

.meta b.admin-name {
  color: #dc2626 !important;
  font-weight: 800 !important;
  font-size: 13.5px;
}

.meta .current-user-name {
  color: #fff;
  background: linear-gradient(135deg, var(--primary), #0f766e);
  padding: 2px 8px;
  border-radius: 999px;
  font-weight: 650;
  font-size: 12.5px;
  box-shadow: 0 2px 6px rgba(37,99,235,0.18);
}

.meta .current-user-name.admin-name {
  color: #ffffff !important;
  background: linear-gradient(135deg, #dc2626, #b91c1c) !important;
  box-shadow: 0 5px 12px rgba(220,38,38,0.25) !important;
}

.edit-btn, .delete-btn {
  margin-left: 2px;
  padding: 3px 8px;
  border-radius: 999px;
  cursor: pointer;
  font-size: 12px;
  font-weight: 500;
  transition: background 0.18s ease, color 0.18s ease;
}
.edit-btn { color: #027a48; background: #ecfdf3; }
.delete-btn { color: #b42318; background: #fef3f2; }
.edit-btn:hover { background: #d1fadf; }
.delete-btn:hover { background: #fee4e2; }

.post div[style*="white-space: pre-wrap;"],
.reply div[style*="white-space: pre-wrap;"] {
  margin-top: 4px;
  color: #27364a;
  font-size: 14px;
  line-height: 1.45;
  word-break: break-word;
  overflow-wrap: break-word;
}

.actions {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 6px;
  padding-top: 5px;
  border-top: 1px solid #eef2f6;
}

.reply-btn,
.reaction-trigger,
.reaction-detail-btn {
  min-height: 24px;
  padding: 0 7px;
  border-radius: 999px;
  color: #667085;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  user-select: none;
  transition: background 0.18s ease, color 0.18s ease, transform 0.18s ease;
}

.reply-btn { display: inline-flex; align-items: center; }
.reply-btn:hover,
.reaction-trigger:hover,
.reaction-picker:focus-within .reaction-trigger,
.reaction-detail-btn:hover {
  color: #175cd3;
  background: #eff8ff;
  text-decoration: none;
}

.replies-wrapper { margin-top: 4px; }

.reply-thread-toggle {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin: 6px 0 0 16px;
  padding: 5px 9px 5px 0;
  color: #667085;
  border-radius: 999px;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  user-select: none;
}

.reply-thread-toggle::before {
  content: "";
  width: 28px;
  height: 18px;
  border-left: 2px solid #cfd8e3;
  border-bottom: 2px solid #cfd8e3;
  border-radius: 0 0 0 10px;
  transform: translateY(-5px);
}

.reply-thread-toggle:hover { color: #175cd3; }
.reply-list { margin-top: 4px; }

.reply {
  position: relative;
  margin-top: 7px;
  margin-left: 20px;
  padding: 6px 9px 6px 11px;
  background: #f8fafc;
  border-left: 3px solid #dbeafe;
  border-radius: 0 10px 10px 0;
}

.reply.admin-reply-card {
  border-left: 3px solid #ef4444 !important;
  background: #fffcfc !important;
}

.reply .actions { margin-top: 5px; padding-top: 5px; gap: 7px; }

.reply-status-container {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 7px;
  padding: 7px 10px;
  color: #175cd3;
  background: #eff8ff;
  border: 1px solid #b2ddff;
  border-radius: 14px;
  animation: slideIn 0.25s ease;
}

.replying-text { font-size: 13px; font-weight: 600; }
.replying-text b { color: #0f766e; background: rgba(20,184,166,0.10); padding: 2px 7px; border-radius: 999px; }
.cancel-reply { color: #667085; cursor: pointer; font-size: 20px; line-height: 1; transition: color 0.18s ease; }
.cancel-reply:hover { color: var(--danger); }

@keyframes slideIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

.reaction-picker {
  position: relative;
  display: inline-flex;
  align-items: center;
  padding-top: 42px;
  margin-top: -42px;
}

.reaction-trigger { display: inline-flex; align-items: center; gap: 5px; }
.reaction-total { color: #98a2b3; font-size: 12px; font-weight: 600; }
.reaction-detail-btn { display: inline-flex; align-items: center; }

.reaction-detail-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(180px, 1fr);
  gap: 12px;
  margin-top: 10px;
}
.reaction-detail-preview,
.reaction-detail-panel {
  min-width: 0;
  padding: 11px;
  background: #f8fafc;
  border: 1px solid var(--line);
  border-radius: 13px;
}
.reaction-detail-label {
  margin-bottom: 6px;
  color: #667085;
  font-size: 12px;
  font-weight: 600;
}
.reaction-detail-author {
  color: #175cd3;
  font-weight: 700;
  margin-bottom: 5px;
}
.reaction-detail-text {
  max-height: 160px;
  overflow: auto;
  color: #27364a;
  font-size: 13.5px;
  line-height: 1.5;
  white-space: pre-wrap;
  word-break: break-word;
}
.reaction-detail-list { display: grid; gap: 8px; }
.reaction-detail-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 10px 11px;
  background: #f8fafc;
  border: 1px solid var(--line);
  border-radius: 13px;
}
.reaction-detail-user { min-width: 0; color: #172033; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.reaction-detail-type { display: inline-flex; align-items: center; gap: 7px; color: #475467; font-size: 13px; font-weight: 500; flex: 0 0 auto; }

.reaction-bar {
  position: absolute;
  left: -8px;
  bottom: calc(100% - 38px);
  z-index: 20;
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 6px 8px;
  background: #fff;
  border: 1px solid #edf1f5;
  border-radius: 999px;
  box-shadow: 0 14px 34px rgba(16,24,40,0.18);
  opacity: 0;
  pointer-events: none;
  transform: translateY(8px) scale(0.96);
  transform-origin: left bottom;
  transition: opacity 0.16s ease 0.08s, transform 0.16s ease 0.08s;
  white-space: nowrap;
}

.reaction-trigger:hover + .reaction-bar,
.reaction-trigger:focus + .reaction-bar,
.reaction-bar:hover,
.reaction-picker:focus-within .reaction-bar {
  opacity: 1;
  pointer-events: auto;
  transform: translateY(0) scale(1);
  transition-delay: 0s;
}

.reaction-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 30px;
  height: 30px;
  border: 0;
  background: transparent;
  border-radius: 999px;
  cursor: pointer;
  transition: transform 0.16s ease, background 0.16s ease, box-shadow 0.16s ease;
}

.reaction-btn:hover,
.reaction-btn.active {
  transform: translateY(-6px) scale(1.2);
  background: #f8fafc;
  box-shadow: 0 5px 12px rgba(16,24,40,0.13);
}
.reaction-btn.active { outline: 2px solid #b2ddff; }

.react-icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  color: #fff;
  font-size: 15px;
  line-height: 1;
}
.react-icon.like { background: #1877f2; }
.react-icon.love { background: #f43f5e; }
.react-icon.care { background: #f59e0b; }
.react-icon.haha { background: #facc15; }
.react-icon.wow { background: #fbbf24; }
.react-icon.sad { background: #60a5fa; }
.react-icon.angry { background: #ef4444; }
.react-icon.dislike { background: #64748b; }

.modal-overlay {
  position: fixed;
  inset: 0;
  z-index: 1000;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 18px;
  background: rgba(15,23,42,0.48);
  backdrop-filter: blur(6px);
}

.modal-content {
  width: min(94vw, 640px);
  padding: 16px;
  background: #fff;
  border: 1px solid rgba(255,255,255,0.70);
  border-radius: 14px;
  box-shadow: 0 24px 60px rgba(15,23,42,0.24);
  animation: popIn 0.22s ease-out;
}

@keyframes popIn { from { transform: translateY(8px) scale(0.98); opacity: 0; } to { transform: translateY(0) scale(1); opacity: 1; } }

.modal-content h3 { margin: 0 0 8px; color: var(--text); font-size: 18px; font-weight: 600; }
.modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }

#modalInput {
  width: 100%;
  height: 86px;
  padding: 12px;
  border: 1px solid var(--line-strong);
  border-radius: 14px;
  font-family: 'Segoe UI', Arial, sans-serif;
}

.btn-secondary { background: #eef2f6; color: #475467; box-shadow: none; }
.btn-secondary:hover { background: #e4e7ec; }

@media (max-width: 560px) {
  .container { width: 100%; max-width: 100vw; padding: 10px; overflow-x: clip; }
  .header { position: static; min-height: 52px; gap: 8px; border-radius: 14px; align-items: center; }
  .logo { flex: 0 1 auto; font-size: 15px; overflow: hidden; text-overflow: ellipsis; }
  .user-box { flex: 1 1 auto; max-width: none; min-width: 0; }
  .post-box, .post { max-width: 100%; border-radius: 14px; }
  .post { overflow: visible; }
  .meta { padding-right: 0; }
  .post.current-user-post::before { position: static; display: inline-flex; margin-bottom: 6px; }
  .reply { margin-left: 8px !important; padding-left: 9px; }
  .reply-thread-toggle { margin-left: 8px; }
  .reaction-picker { max-width: 100%; }
  .reaction-bar {
    left: 50%;
    max-width: calc(100vw - 28px);
    overflow-x: auto;
    scrollbar-width: none;
    transform: translate(-50%, 8px) scale(0.96);
  }
  .reaction-bar::-webkit-scrollbar { display: none; }
  .reaction-trigger:hover + .reaction-bar,
  .reaction-trigger:focus + .reaction-bar,
  .reaction-bar:hover,
  .reaction-picker:focus-within .reaction-bar {
    transform: translate(-50%, 0) scale(1);
  }
  .reaction-detail-layout { grid-template-columns: 1fr; gap: 8px; }
  .reaction-detail-preview,
  .reaction-detail-panel { padding: 9px; }
  .reaction-detail-text { max-height: 90px; }
  .modal-content { width: min(94vw, 430px); }
  .mute-btn { margin-left: 0; min-width: 132px; }
}
/* ===== SKELETON LOADING ===== */
.skel-bar {
  background: linear-gradient(90deg, #e2e9f5 25%, #f2f6fc 37%, #e2e9f5 63%);
  background-size: 400% 100%;
  animation: skeletonShimmer 1.4s ease infinite;
  border-radius: 8px;
}
.skel-post {
  margin-bottom: 9px;
  padding: 11px 12px 10px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  box-shadow: var(--shadow-soft);
}
.skel-meta-line { width: 140px; height: 14px; margin-bottom: 10px; }
.skel-text-line { height: 14px; margin-bottom: 7px; }
.skel-text-line.w-95 { width: 95%; }
.skel-text-line.w-60 { width: 60%; }
.skel-actions-row { display: flex; gap: 10px; margin-top: 10px; }
.skel-pill { width: 70px; height: 22px; border-radius: 999px; }
.skel-reply { width: 50px; height: 22px; border-radius: 999px; }

/* ================= DARK MODE ================= */

































































/* ===== SEARCH & SORT (trong post-actions-bar) ===== */
.search-box {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 6px 10px;
  background: #f4f7fb;
  border: 1px solid var(--line-strong);
  border-radius: 10px;

<script type="module">
/* ================= SUPABASE CONFIG ================= */
import { supabase, beginOnlineSession, logAppError } from "../supabase-config.js";
window.logAppError = logAppError;

/* ================= BIẾN TOÀN CỤC ================= */
let currentUser = null;
let replyTo = null;
let isMuted = localStorage.getItem("forum_muted") === "true";
let modalAction = null;
let userDirectoryCache = null;
let pendingImageFile = null;

const POSTS_PER_PAGE = 10;
let currentPage = 1;
let filteredParents = [];
let lastAllPosts = [];
let postsChannel = null;
let eventsChannel = null;
const authorRoleCache = new Map();
const rateLimitMap = new Map();
function checkRateLimit(key, ms) {
  const now = Date.now();
  const last = rateLimitMap.get(key) || 0;
  if (now - last < ms) return false;
  rateLimitMap.set(key, now);
  return true;
}
const expandedThreads = new Set();

/* ================= HỆ THỐNG MODAL (POPUP) ================= */
function showModal(title, msg, isInput, currentText, onConfirm, isHtml = false) {
  const modal = document.getElementById("customModal");
  const modalInput = document.getElementById("modalInput");
  const modalMsg = document.getElementById("modalMsg");
  const modalTitle = document.getElementById("modalTitle");

  modalTitle.innerText = title;
  if(isHtml) modalMsg.innerHTML = msg;
  else modalMsg.innerText = msg;
  modalAction = onConfirm;

  if (isInput) {
    modalInput.style.display = "block";
    modalInput.value = currentText;
    modalMsg.style.display = "none";
  } else {
    modalInput.style.display = "none";
    modalMsg.style.display = "block";
  }
  modal.style.display = "flex";
}

/* ================= XÁC THỰC LẠI QUYỀN HẠN USER QUA SUPABASE ================= */
let lastApplyUid = null;
let lastApplyTime = 0;

async function applyReceivedUser(receivedUser) {
  const uid = receivedUser && receivedUser.uid;
  const now = Date.now();
  if (uid && uid === lastApplyUid && now - lastApplyTime < 3000) {
    lastApplyTime = now;
    return;
  }
  if (uid) {
    lastApplyUid = uid;
    lastApplyTime = now;
  }

  if (receivedUser && receivedUser.uid) {
    try {
      const { data: row } = await supabase.from("users")
        .select("name, role")
        .eq("id", receivedUser.uid)
        .maybeSingle();
      if (row) {
        currentUser = {
          uid: receivedUser.uid,
          name: row.name || receivedUser.displayName || receivedUser.name || "Người dùng",
          role: row.role || "member"
        };
      } else {
        currentUser = {
          uid: receivedUser.uid,
          name: receivedUser.displayName || receivedUser.name || "Người dùng",
          role: receivedUser.role || "member"
        };
      }
    } catch (err) {
      console.error("Lỗi kiểm tra quyền hạn user từ Supabase:", err);
      currentUser = receivedUser;
    }
  } else {
    currentUser = receivedUser;
  }

  updateUserBox();

  // Ép làm mới lại danh sách bài đăng sau khi xác thực vai trò hoàn tất
  await loadPosts();
}

window.addEventListener("message", async (event) => {
  if (event.data && event.data.type === "USER_INFO") {
    await applyReceivedUser(event.data.user);
  }
});


function escapeHTML(value){
  return String(value || "").replace(/[&<>"']/g, char => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[char]));
}

function getInitials(name){
  const parts = String(name || "?").trim().split(/\s+/).filter(Boolean);
  if(parts.length === 0) return "?";
  return parts.slice(-2).map(part => part[0]).join("").toUpperCase();
}

function updateUserBox(){
  const userBox = document.getElementById("userBox");
  if(!userBox) return;
  if(!currentUser) {
    userBox.innerText = "Chưa đăng nhập";
    return;
  }
  const safeName = escapeHTML(currentUser.name || "Người dùng");
  const isAdmin = currentUser.role === 'admin' || currentUser.role === 'Admin';
  const avatarClass = isAdmin ? 'user-avatar admin' : 'user-avatar';
  const nameClass = isAdmin ? 'user-name-current admin-name' : 'user-name-current';
  const adminBadge = isAdmin ? ' <span class="admin-badge" style="background:#fee2e2;color:#dc2626;padding:3px 8px;font-weight:800;border-radius:999px;margin-left:8px;border:1px solid rgba(220,38,38,0.15);">🛡 Admin</span>' : '';
  userBox.innerHTML = `<span class="${avatarClass}">${escapeHTML(getInitials(currentUser.name))}</span><span class="${nameClass}">${safeName}</span>${adminBadge}`;
}

/* ================= KHI TRANG LOAD XONG ================= */
window.addEventListener("load", () => {
  updateMuteUI();
  
  const contentArea = document.getElementById("content");
  const charCountDisplay = document.getElementById("charCount");

  contentArea.addEventListener("input", function() {
    this.style.height = "auto"; 
    this.style.height = (this.scrollHeight) + "px"; 

    const len = this.value.length;
    charCountDisplay.innerText = len;
    charCountDisplay.style.color = len >= 450 ? "#ef4444" : "#64748b";
  });

  const modal = document.getElementById("customModal");
  document.getElementById("modalCancel").onclick = () => { modal.style.display = "none"; };
  document.getElementById("modalConfirm").onclick = () => {
    if (typeof modalAction === "function") modalAction();
    modal.style.display = "none";
  };
  window.parent.postMessage({ type: "FORUM_READY" }, "*");
});

/* ================= QUẢN LÝ ÂM THANH ================= */
function updateMuteUI() {
  const btn = document.getElementById("muteBtn");
  if (isMuted) {
    btn.innerHTML = "🔇 Âm thanh: Tắt";
    btn.style.background = "#ef4444"; 
  } else {
    btn.innerHTML = "🔊 Âm thanh: Bật";
    btn.style.background = "#64748b"; 
  }
}

function toggleMute() {
  isMuted = !isMuted;
  localStorage.setItem("forum_muted", isMuted); 
  updateMuteUI();
}

function playSound(type){
  if (isMuted) return;
  let id = "sound" + type.charAt(0).toUpperCase() + type.slice(1);
  let sound = document.getElementById(id);
  if(sound){
    sound.volume = 1;
    sound.currentTime = 0;
    sound.play().catch(e => console.log("Sound error: " + e));
  }
}

let recentLocalSounds = [];
let postsReloadTimer = null;

function scheduleLoadPosts(){
  clearTimeout(postsReloadTimer);
  postsReloadTimer = setTimeout(() => loadPosts(), 150);
}

function notifySound(type, reactionType){
  const t = Date.now();
  recentLocalSounds.push(t);
  if (recentLocalSounds.length > 30) recentLocalSounds.shift();
  playSound(type);
  supabase.from("forum_events").insert({ type, reaction_type: reactionType || null, time: t })
    .then(() => {})
    .catch(e => console.log("Lỗi ghi sự kiện âm thanh:", e));
}

/* ================= GỬI BÀI VIẾT / PHẢN HỒI ================= */
const MAX_IMAGE_SIZE = 5 * 1024 * 1024;
const ALLOWED_IMAGE_TYPES = ["image/png", "image/jpeg", "image/gif", "image/webp"];

function attachImage(){
  const input = document.getElementById("imageInput");
  if (input) input.click();
}

(function setupPasteImage(){
  const contentInput = document.getElementById("content");
  if (!contentInput) return;
  contentInput.addEventListener("paste", function(e){
    const files = e.clipboardData && e.clipboardData.files;
    if (!files || files.length === 0) return;
    const file = files[0];
    if (!ALLOWED_IMAGE_TYPES.includes(file.type)) return;
    if (file.size > MAX_IMAGE_SIZE) {
      showModal("Lỗi", "Ảnh dán quá lớn (tối đa 5MB).", false, "", null);
      return;
    }
    e.preventDefault();
    pendingImageFile = file;
    renderImagePreview();
  });
})();

function onImageSelected(e){
  const file = e.target.files && e.target.files[0];
  e.target.value = "";
  if (!file) return;
  if (!ALLOWED_IMAGE_TYPES.includes(file.type)){
    showModal("Lỗi", "Chỉ chấp nhận ảnh PNG, JPG, GIF hoặc WEBP.", false, "", null);
    return;
  }
  if (file.size > MAX_IMAGE_SIZE){
    showModal("Lỗi", "Ảnh quá lớn (tối đa 5MB). Vui lòng chọn ảnh khác.", false, "", null);
    return;
  }
  pendingImageFile = file;
  renderImagePreview();
}

function renderImagePreview(){
  const wrap = document.getElementById("imagePreview");
  if (!wrap) return;
  wrap.innerHTML = "";
  if (!pendingImageFile) return;
  const url = URL.createObjectURL(pendingImageFile);
  const div = document.createElement("div");
  div.className = "image-preview-item";
  div.innerHTML = `<img src="${url}" alt="Ảnh đang chọn"><span class="image-preview-remove" onclick="removePendingImage()">✕</span>`;
  wrap.appendChild(div);
}

function removePendingImage(){
  pendingImageFile = null;
  renderImagePreview();
}

function getFileExt(type){
  return ({"image/png":"png","image/jpeg":"jpg","image/gif":"gif","image/webp":"webp"})[type] || "img";
}

async function uploadPendingImage(){
  const file = pendingImageFile;
  if (!file) return null;
  const { data: { session } } = await supabase.auth.getSession();
  const uid = (session && session.user && session.user.id) || (currentUser && currentUser.uid);
  if (!uid) return null;
  const path = `${uid}/${crypto.randomUUID()}.${getFileExt(file.type)}`;
  const { error } = await supabase.storage.from("forum-images").upload(path, file);
  if (error) throw error;
  const { data } = supabase.storage.from("forum-images").getPublicUrl(path);
  return data?.publicUrl || null;
}

function runCleanup(){
  supabase.rpc("cleanup_expired_forum_images")
    .then(() => {})
    .catch(e => console.log("[forum] cleanup lỗi:", e));
}

async function sendPost(){
  const contentArea = document.getElementById("content");
  const text = contentArea.value.trim();
  const hasImage = !!pendingImageFile;

  if (!text && !hasImage) return;
  if (!currentUser) {
    lhToast("Vui lòng chờ ứng dụng xác thực thông tin người dùng...", 'info');
    return;
  }
  if(!checkRateLimit("sendPost", 3000)) {
    lhToast("Bạn gửi quá nhanh. Vui lòng chờ 3 giây.", { type: "warning", title: "Chống spam" });
    return;
  }

  const submitBtn = document.querySelector(".post-submit");
  const originalHtml = submitBtn ? submitBtn.innerHTML : "";

  try {
    if (submitBtn){ submitBtn.disabled = true; submitBtn.innerHTML = "Đang tải..."; }
    let imageUrl = null;
    if (hasImage) imageUrl = await uploadPendingImage();

    const postText = text || "(Hình ảnh)";

    const { data: newPostId, error: createError } = await supabase.rpc("create_forum_post", {
      p_text: postText,
      p_image_url: imageUrl || null,
      p_parent_id: replyTo || null
    });
    if (createError) throw createError;
    if (!newPostId) throw new Error("Chưa xác thực được người dùng");
    notifySound("post");
    runCleanup();
    scheduleLoadPosts();
  } catch (e) {
    console.error("Lỗi gửi bài viết:", e);
    if (window.logAppError) window.logAppError({ source: "forum", category: "action", level: "error", code: "POST_FAIL", message: "Đăng bài viết thất bại: " + (e.message || e), detail: { textLength: text.length, hasImage } });
    showModal("Lỗi", "Gửi bài viết thất bại. Vui lòng thử lại.", false, "", null);
    if (submitBtn){ submitBtn.disabled = false; submitBtn.innerHTML = originalHtml; }
    return;
  }

  contentArea.value = "";
  contentArea.style.height = "80px";
  document.getElementById("charCount").innerText = "0";
  document.getElementById("charCount").style.color = "#64748b";
  pendingImageFile = null;
  renderImagePreview();

  replyTo = null;
  document.getElementById("replyingTo").innerHTML = "";
  if (submitBtn){ submitBtn.disabled = false; submitBtn.innerHTML = originalHtml; }
  contentArea.focus();
}

/* ================= HIỂN THỊ BÀI VIẾT (RENDER) ================= */
async function loadPosts(){
  clearTimeout(window.__forumSkeletonTimeout);
  const container = document.getElementById("posts");
  if(!container) return;

  const scrollPos = window.scrollY;
  container.innerHTML = "";

  try {
    const { data } = await supabase.from("forum_posts").select("*").order("time", { ascending: false }).range(0, 499);
    lastAllPosts = data || [];
    if (lastAllPosts.length >= 500) {
      console.warn("Forum: Đã tải 500 bài viết gần nhất. Có thể còn bài cũ hơn.");
    }

    const uniqueUids = [...new Set(lastAllPosts.map(p => p.user_id).filter(Boolean))];
    const uncachedUids = uniqueUids.filter(uid => !authorRoleCache.has(uid));
    if (uncachedUids.length > 0) {
      try {
        const { data: roleRows } = await supabase
          .from("users")
          .select("id, role")
          .in("id", uncachedUids);
        (roleRows || []).forEach(r => authorRoleCache.set(r.id, r.role || "member"));
        uncachedUids.forEach(uid => { if (!authorRoleCache.has(uid)) authorRoleCache.set(uid, "member"); });
      } catch (e) {
        uncachedUids.forEach(uid => { if (!authorRoleCache.has(uid)) authorRoleCache.set(uid, "member"); });
      }
    }
  } catch (e) {
    console.error("Lỗi tải bài viết:", e);
    lastAllPosts = [];
  }

  if(lastAllPosts.length === 0) {
    document.getElementById("paginationBar").innerHTML = "";
    document.getElementById("paginationInfo").innerHTML = "";
  }

  applyFilters();
  window.scrollTo(0, scrollPos);
}

function subscribePosts(){
  if (postsChannel) supabase.removeChannel(postsChannel);
  postsChannel = supabase.channel("forum-posts")
    .on("postgres_changes", { event: "*", schema: "public", table: "forum_posts" }, () => scheduleLoadPosts())
    .subscribe();
}

function applyFilters(){
  const container = document.getElementById("posts");
  if(!container) return;
  container.innerHTML = "";

  const searchVal = (document.getElementById("searchInput")?.value || "").toLowerCase().trim();
  const sortVal = document.getElementById("sortSelect")?.value || "newest";

  let parents = lastAllPosts.filter(p => !p.parent_id);

  if(searchVal){
    parents = parents.filter(p =>
      (p.text || "").toLowerCase().includes(searchVal) ||
      (p.user_name || "").toLowerCase().includes(searchVal)
    );
  }

  const pinned = parents.filter(p => p.pinned);
  const unpinned = parents.filter(p => !p.pinned);

  const sortList = (list) => {
    if (sortVal === "newest"){
      list.sort((a, b) => b.time - a.time);
    } else if (sortVal === "oldest"){
      list.sort((a, b) => a.time - b.time);
    } else if (sortVal === "replies"){
      list.sort((a, b) => {
        const countA = lastAllPosts.filter(p => p.parent_id === a.id).length;
        const countB = lastAllPosts.filter(p => p.parent_id === b.id).length;
        return countB - countA;
      });
    }
  };
  sortList(pinned);
  sortList(unpinned);

  filteredParents = [...pinned, ...unpinned];

  const total = filteredParents.length;
  const totalPages = Math.max(1, Math.ceil(total / POSTS_PER_PAGE));
  if(currentPage > totalPages) currentPage = totalPages;

  const startIdx = (currentPage - 1) * POSTS_PER_PAGE;
  const pageItems = filteredParents.slice(startIdx, startIdx + POSTS_PER_PAGE);

  if (lastAllPosts.length === 0) {
    container.innerHTML = `
      <div class="forum-empty">
        <div class="forum-empty-icon">💬</div>
        <h3>Chưa có bài viết nào</h3>
        <p>Diễn đàn hiện chưa có bài viết. Hãy là người đầu tiên chia sẻ! Nếu bạn gặp vấn đề, vui lòng liên hệ Admin để được hỗ trợ.</p>
        <a class="forum-empty-contact" href="mailto:learnhubplatform@gmail.com">
          <i class="fas fa-envelope"></i> Liên hệ Admin
        </a>
      </div>`;
    document.getElementById("paginationBar").innerHTML = "";
    document.getElementById("paginationInfo").innerHTML = "";
    return;
  }

  if (pageItems.length === 0) {
    container.innerHTML = `
      <div class="forum-empty">
        <div class="forum-empty-icon"><i class="fa-solid fa-magnifying-glass" style="font-size:32px;color:#94a3b8"></i></div>
        <h3>Không tìm thấy kết quả</h3>
        <p>Không có bài viết nào khớp với từ khóa tìm kiếm. Thử từ khác hoặc xóa bộ lọc.</p>
      </div>`;
    document.getElementById("paginationBar").innerHTML = "";
    document.getElementById("paginationInfo").innerHTML = "";
    return;
  }

  pageItems.forEach(post => {
    container.appendChild(createPostElement(post, lastAllPosts));
  });

  renderPagination(total, totalPages);
}

function renderPagination(total, totalPages){
  const bar = document.getElementById("paginationBar");
  const info = document.getElementById("paginationInfo");
  if(!bar || !info) return;

  if(total <= POSTS_PER_PAGE){
    bar.innerHTML = "";
    info.innerHTML = total > 0 ? `Hiển thị ${total} bài viết` : "";
    return;
  }

  const start = (currentPage - 1) * POSTS_PER_PAGE + 1;
  const end = Math.min(currentPage * POSTS_PER_PAGE, total);
  info.innerHTML = `Hiển thị ${start}-${end} trong ${total} bài viết`;

  let html = "";
  html += `<button ${currentPage === 1 ? 'disabled' : ''} onclick="goToPage(${currentPage - 1})">‹</button>`;

  const maxVisible = 5;
  let startPage = Math.max(1, currentPage - Math.floor(maxVisible / 2));
  let endPage = Math.min(totalPages, startPage + maxVisible - 1);
  if(endPage - startPage < maxVisible - 1) startPage = Math.max(1, endPage - maxVisible + 1);

  if(startPage > 1){
    html += `<button onclick="goToPage(1)">1</button>`;
    if(startPage > 2) html += `<button disabled>…</button>`;
  }

  for(let i = startPage; i <= endPage; i++){
    html += `<button class="${i === currentPage ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
  }

  if(endPage < totalPages){
    if(endPage < totalPages - 1) html += `<button disabled>…</button>`;
    html += `<button onclick="goToPage(${totalPages})">${totalPages}</button>`;
  }

  html += `<button ${currentPage === totalPages ? 'disabled' : ''} onclick="goToPage(${currentPage + 1})">›</button>`;
  bar.innerHTML = html;
}

function goToPage(page){
  currentPage = page;
  applyFilters();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function createPostElement(post, allPosts){
  const div = document.createElement("div");
  const isOwner = currentUser && post.user_id === currentUser.uid;
  const authorRole = authorRoleCache.get(post.user_id) || "member";
  const isAdmin = authorRole === "Admin" || authorRole === "admin";
  const isAdminUser = currentUser && (currentUser.role === 'admin' || currentUser.role === 'Admin');

  let postClasses = [];
  if (isOwner) postClasses.push("current-user-post");
  if (isAdmin) postClasses.push("admin-post-card");
  if (post.pinned) postClasses.push("pinned-post");
  div.className = "post " + postClasses.join(" ");

  const ownerActions = isOwner ? `
    <span class="edit-btn" onclick="editPost('${post.id}')">✎ Sửa</span>
    <span class="delete-btn" onclick="deletePost('${post.id}')">🗑 Xóa</span>
  ` : "";

  const pinAction = isAdminUser ? (
    post.pinned
      ? `<span class="pin-btn" onclick="unpinPost('${post.id}')">📌 Bỏ ghim</span>`
      : `<span class="pin-btn" onclick="pinPost('${post.id}')">📌 Ghim bài</span>`
  ) : "";

  const pinBadge = post.pinned ? `<span class="pin-badge">📌 Đã ghim</span>` : "";
  const nameClass = isOwner && !isAdmin ? "current-user-name" : "";
  const adminNameClass = isAdmin ? "admin-name" : "";
  const adminBadge = isAdmin ? `<span class="admin-badge">🛡 Admin</span>` : "";
  const postImageHtml = post.image_url
    ? `<div class="post-image-wrap"><img class="post-image" src="${escapeHTML(post.image_url)}" loading="lazy" referrerpolicy="no-referrer" onclick="window.open(this.src)" onerror="this.remove()" alt="Ảnh bài viết"></div>`
    : "";

  div.innerHTML = `
    <div class="meta">
      <b class="${nameClass} ${adminNameClass}">${escapeHTML(post.user_name)}</b>${adminBadge}${pinBadge} • ${formatTime(post.time)} 
      ${post.is_edited ? '<i style="font-size:10px">(đã chỉnh sửa)</i>' : ''}
      ${ownerActions}${pinAction}
    </div>
    <div style="white-space: pre-wrap;">${escapeHTML(post.text)}</div>
    ${postImageHtml}
    <div class="actions">
      ${renderReactionButtons(post)}
      <span class="reply-btn" onclick="setReply('${post.id}')">Trả lời</span>
    </div>
  `;

  const repliesContainer = document.createElement("div");
  renderReplies(post.id, repliesContainer, allPosts, 1);
  div.appendChild(repliesContainer);
  
  return div;
}

function renderReplies(parentId, container, allPosts, level){
  const replies = allPosts
    .filter(p => p.parent_id === parentId)
    .sort((a, b) => a.time - b.time);
  if(replies.length === 0) return;

  let expanded = expandedThreads.has(parentId);
  const wrapper = document.createElement("div");
  wrapper.className = "replies-wrapper";

  const renderList = () => {
    wrapper.innerHTML = "";

    const btn = document.createElement("div");
    btn.className = "reply-thread-toggle";
    btn.innerText = expanded ? "Ẩn phản hồi" : `Xem ${replies.length} phản hồi`;
    btn.onclick = (e) => {
      e.stopPropagation();
      expanded = !expanded;
      if (expanded) expandedThreads.add(parentId);
      else expandedThreads.delete(parentId);
      renderList();
    };
    wrapper.appendChild(btn);

    if(!expanded) return;

    const listWrap = document.createElement("div");
    listWrap.className = "reply-list";

    replies.forEach(rep => {
      const repDiv = document.createElement("div");
      const isOwner = currentUser && rep.user_id === currentUser.uid;
      const replyAuthorRole = authorRoleCache.get(rep.user_id) || "member";
      const isAdminReply = replyAuthorRole === "Admin" || replyAuthorRole === "admin";

      let replyClasses = ["reply"];
      if (isAdminReply) replyClasses.push("admin-reply-card");
      repDiv.className = replyClasses.join(" ");
      repDiv.style.marginLeft = Math.min(level * 12, 36) + "px";
      
      const ownerActions = isOwner ? `
        <span class="edit-btn" onclick="editPost('${rep.id}')">✎</span>
        <span class="delete-btn" onclick="deletePost('${rep.id}')">🗑</span>
      ` : "";

      const nameClass = isOwner && !isAdminReply ? "current-user-name" : "";
      const adminNameClass = isAdminReply ? "admin-name" : "";
      const adminBadge = isAdminReply ? `<span class="admin-badge">🛡 Admin</span>` : "";
      const replyImageHtml = rep.image_url
        ? `<div class="post-image-wrap"><img class="post-image" src="${escapeHTML(rep.image_url)}" loading="lazy" referrerpolicy="no-referrer" onclick="window.open(this.src)" onerror="this.remove()" alt="Ảnh phản hồi"></div>`
        : "";

      repDiv.innerHTML = `
        <div class="meta">
          <b class="${nameClass} ${adminNameClass}">${escapeHTML(rep.user_name)}</b>${adminBadge} • ${formatTime(rep.time)} ${ownerActions}
        </div>
        <div style="white-space: pre-wrap;">${escapeHTML(rep.text)}</div>
        ${replyImageHtml}
        <div class="actions">
          ${renderReactionButtons(rep)}
          <span class="reply-btn" onclick="setReply('${rep.id}')">Trả lời</span>
        </div>
      `;
      
      renderReplies(rep.id, repDiv, allPosts, level + 1);
      listWrap.appendChild(repDiv);
    });

    wrapper.appendChild(listWrap);
  };

  renderList();
  container.appendChild(wrapper);
}
/* ================= TIỆN ÍCH ================= */
function formatTime(t){
  if(!t) return "—";
  const d = new Date(t);
  if(isNaN(d.getTime())) return "—";
  const date = d.getDate().toString().padStart(2,'0');
  const month = (d.getMonth()+1).toString().padStart(2,'0');
  const year = d.getFullYear();
  const hours = d.getHours().toString().padStart(2,'0');
  const minutes = d.getMinutes().toString().padStart(2,'0');
  const seconds = d.getSeconds().toString().padStart(2,'0');
  
  return `${date}/${month}/${year} ${hours}:${minutes}:${seconds}`;
}

const REACTIONS = [
  { type: "like", icon: "👍", label: "Thích" },
  { type: "love", icon: "❤", label: "Yêu thích" },
  { type: "care", icon: "🥰", label: "Thương thương" },
  { type: "haha", icon: "😄", label: "Haha" },
  { type: "wow", icon: "😮", label: "Wow" },
  { type: "sad", icon: "😢", label: "Buồn" },
  { type: "angry", icon: "😡", label: "Giận" }
];

function countReaction(p, type){
  const reactions = p.reactions || {};
  let total = Object.values(reactions).filter(value => value === type).length;
  if(type === "like" && p.likes) total += Object.keys(p.likes).filter(uid => !reactions[uid]).length;
  if(type === "dislike" && p.dislikes) total += Object.keys(p.dislikes).filter(uid => !reactions[uid]).length;
  return total;
}

function getUserReaction(p){
  if(!currentUser) return "";
  const uid = currentUser.uid;
  if(p.reactions && p.reactions[uid]) return p.reactions[uid];
  if(p.likes && p.likes[uid]) return "like";
  if(p.dislikes && p.dislikes[uid]) return "dislike";
  return "";
}

function getReactionMeta(type){
  if(type === "dislike") return { type: "dislike", icon: "👎", label: "Không thích" };
  return REACTIONS.find(reaction => reaction.type === type) || REACTIONS[0];
}

function totalReactionCount(post){
  const reactionUsers = new Set(Object.keys(post.reactions || {}));
  let total = reactionUsers.size;
  if(post.likes) Object.keys(post.likes).forEach(uid => { if(!reactionUsers.has(uid)) total++; });
  if(post.dislikes) Object.keys(post.dislikes).forEach(uid => { if(!reactionUsers.has(uid)) total++; });
  return total;
}

function renderReactionButtons(post){
  const selected = getUserReaction(post);
  const current = selected ? getReactionMeta(selected) : { type: "like", icon: "👍", label: "Thích" };
  const total = totalReactionCount(post);
  return `
    <span class="reaction-picker">
      <span class="reaction-trigger" onclick="toggleReaction('${post.id}', '${current.type}')">
        ${selected ? `<span class="react-icon ${current.type}">${current.icon}</span>` : ""}
        <span>${current.label}</span>
        ${total ? `<span class="reaction-total">${total}</span>` : ""}
      </span>
      <span class="reaction-bar">
        ${REACTIONS.map(reaction => `
          <span class="reaction-btn ${selected === reaction.type ? "active" : ""}" title="${reaction.label}" onclick="toggleReaction('${post.id}', '${reaction.type}')">
            <span class="react-icon ${reaction.type}">${reaction.icon}</span>
          </span>
        `).join("")}
      </span>
    </span>
    ${total ? `<span class="reaction-detail-btn" onclick="showReactionDetails('${post.id}')">Chi tiết</span>` : ""}
  `;
}

function countLikes(p){ return countReaction(p, "like"); }
function countDislikes(p){ return countReaction(p, "dislike"); }

function collectReactionEntries(post){
  const entriesByUid = new Map();
  Object.entries(post.reactions || {}).forEach(([uid, type]) => {
    if(uid && type) entriesByUid.set(uid, type);
  });
  Object.keys(post.likes || {}).forEach(uid => {
    if(uid && !entriesByUid.has(uid)) entriesByUid.set(uid, "like");
  });
  Object.keys(post.dislikes || {}).forEach(uid => {
    if(uid && !entriesByUid.has(uid)) entriesByUid.set(uid, "dislike");
  });
  return [...entriesByUid.entries()].map(([uid, type]) => ({ uid, type }));
}

async function getUserDirectory(){
  if(userDirectoryCache) return userDirectoryCache;
  const directory = new Map();
  try {
    const { data } = await supabase.from("users").select("id, name, email");
    (data || []).forEach(row => {
      directory.set(row.id, row.name || row.email || row.id);
    });
  } catch (error) {
    console.warn("Không tải được danh sách user:", error);
  }
  userDirectoryCache = directory;
  return directory;
}

async function showReactionDetails(postId){
  const { data: post } = await supabase.from("forum_posts").select("*").eq("id", postId).maybeSingle();
  if(!post) return showModal("Chi tiết cảm xúc", "Không tìm thấy bài viết này.", false, "", null);

  const entries = collectReactionEntries(post);
  if(entries.length === 0) return showModal("Chi tiết cảm xúc", "Chưa có ai thả cảm xúc.", false, "", null);

  const directory = await getUserDirectory();
  const rows = entries.map(entry => {
    const meta = getReactionMeta(entry.type);
    const name = directory.get(entry.uid) || (currentUser && currentUser.uid === entry.uid ? currentUser.name : "User không rõ");
    return `
      <div class="reaction-detail-item">
        <span class="reaction-detail-user">${escapeHTML(name)}</span>
        <span class="reaction-detail-type"><span class="react-icon ${meta.type}">${meta.icon}</span>${escapeHTML(meta.label)}</span>
      </div>
    `;
  }).join("");
  const postTitle = post.parent_id ? "Bình luận đang xem" : "Bài viết đang xem";
  const preview = `
    <div class="reaction-detail-preview">
      <div class="reaction-detail-label">${postTitle}</div>
      <div class="reaction-detail-author">${escapeHTML(post.user_name || "Người dùng")}</div>
      <div class="reaction-detail-text">${escapeHTML(post.text || "")}</div>
    </div>
  `;

  showModal("Chi tiết cảm xúc", `<div class="reaction-detail-layout">${preview}<div class="reaction-detail-panel"><div class="reaction-detail-label">Ai đã bày tỏ cảm xúc</div><div class="reaction-detail-list">${rows}</div></div></div>`, false, "", null, true);
}

function editPost(postId) {
  const post = lastAllPosts.find(p => p.id === postId);
  if (!post) return;
  const oldText = post.text || "";
  showModal("Chỉnh sửa bài viết", "", true, oldText, () => {
    const newText = document.getElementById("modalInput").value.trim();
    if (newText && newText !== oldText) {
      supabase.from("forum_posts").update({
        text: newText,
        is_edited: true,
        edit_time: Date.now()
      }).eq("id", postId).catch(e => console.error("Lỗi chỉnh sửa bài viết:", e.message));
    }
  });
}

async function pinPost(postId) {
  if (!currentUser || (currentUser.role !== 'admin' && currentUser.role !== 'Admin')) return;
  try {
    const { error } = await supabase.rpc("set_forum_post_pinned", { p_post_id: postId, p_pinned: true });
    if (error) throw error;
    scheduleLoadPosts();
  } catch (e) {
    console.error("Lỗi ghim bài:", e);
    showModal("Lỗi", "Không ghim được bài viết. Vui lòng thử lại.", false, "", null);
  }
}

async function unpinPost(postId) {

  try {
    const { error } = await supabase.rpc("set_forum_post_pinned", { p_post_id: postId, p_pinned: false });

    scheduleLoadPosts();

const FORUM_SUBSCRIBE_GRACE_MS = 3000;
function subscribeEvents(){
  if (eventsChannel) supabase.removeChannel(eventsChannel);
  const subscribeTime = Date.now();
  eventsChannel = supabase.channel("forum-events-sound")
    .on("postgres_changes", { event: "INSERT", schema: "public", table: "forum_events" }, (payload) => {
      const ev = payload.new;
      if (ev && ev.time) {
        if (Date.now() - subscribeTime < FORUM_SUBSCRIBE_GRACE_MS) return;
        const idx = recentLocalSounds.indexOf(ev.time);
        if (idx !== -1) { recentLocalSounds.splice(idx, 1); return; }
        if (Date.now() - ev.time < 5000) playSound(ev.type);
      }
    })
    .subscribe();
}

  const avatar = user.photo || user.photoURL || "https://i.imgur.com/6VBx3io.png";
  const wt = document.getElementById("welcomeText");
  if (wt) wt.innerText = "";
  const un = document.getElementById("userName");
  if (un) un.innerText = user.displayName || user.name || user.email || "";
  const userAvatar = document.getElementById("userAvatar");
  if (userAvatar) userAvatar.src = avatar;
  if (window.learnHubUser && window.learnHubUser.uid && typeof window.__forumSetupOnline === 'function') window.__forumSetupOnline(user);
}
window.__forumApplyHeaderUser = applyHeaderUser;
</script>
