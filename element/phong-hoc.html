<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<link rel="icon" href="../pictures/favicon.png" sizes="any">
<link rel="icon" type="image/png" sizes="48x48" href="../pictures/favicon.png">
<meta name="theme-color" content="#1a73e8">
<title>Phòng Học - LearnHub Platform</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" media="print" onload="this.media='all'">
<style>
:root{
  --bg:transparent;--text:#111827;--text-sub:#6b7280;--border:#e5e7eb;
  --card-bg:#ffffff;--card-border:#e2e5ec;
  --notice-bg:#f0f4ff;--notice-border:#d0daf0;
  --quiz-bg:#ffffff;--quiz-border:#e5e7eb;
}
body.dark-mode{
  --bg:transparent;--text:#f1f5f9;--text-sub:#94a3b8;--border:#1e293b;
  --card-bg:#1e293b;--card-border:#334155;
  --notice-bg:#1e293b;--notice-border:#334155;
  --quiz-bg:#1e293b;--quiz-border:#334155;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;min-height:100vh;font-family:'Inter','Segoe UI',sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden;scrollbar-width:none;-ms-overflow-style:none;}
html::-webkit-scrollbar,body::-webkit-scrollbar{display:none;}
body{padding:4px 6px 12px;}
iframe{width:100%;border:none !important;outline:none !important;display:block;}

/* Chỉ áp cho iframe làm bài nhúng trong card (không phải khung full màn hình #quizFrame) */
.quiz-box iframe {
  width: 100%;
  height: 60vh;
  min-height: 350px;
  max-height: 700px;
  border: none !important;
  display: block;
  margin: 0;
  padding: 0;
}

/* #quizFrame chạy full màn hình (quiz-box bao ngoài đã set height:100vh) nên không giới hạn chiều cao */
#quizFrame {
  width: 100%;
  height: 100%;
  min-height: 0;
  max-height: none;
  border: none !important;
  display: block;
  margin: 0;
  padding: 0;
}

/* ===== SUBJECT TABS ===== */
.subject-tabs{display:flex;gap:4px;overflow-x:auto;padding:0 0 8px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;}
.subject-tabs::-webkit-scrollbar{display:none;}
.subject-title{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:800;color:var(--text);margin:12px 2px 8px;}
.subject-title i{color:var(--text-sub);font-size:13px;}

/* ===== SUBJECT BLOCK (khối liền mạch: tiêu đề + tabs + nội dung) ===== */
.subject-block{background:var(--card-bg);border:1px solid var(--card-border);border-radius:16px;padding:14px 14px 18px;overflow:hidden;}
.subject-block .subject-title{margin:0 2px 12px;padding-bottom:12px;border-bottom:1px solid var(--card-border);}
.subject-block .subject-title i{font-size:14px;}
.subject-block .subject-tabs{padding-bottom:12px;}

/* ===== PANELS ===== */
.subject-panel{display:none;}
.subject-panel.active{display:block;}
.subject-tab{flex:1 1 0;min-width:0;padding:8px 4px;border-radius:10px;font-size:12px;font-weight:600;border:1.5px solid var(--border);background:var(--card-bg);color:var(--text-sub);cursor:pointer;transition:all 0.2s;scroll-snap-align:start;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.subject-tab:hover{border-color:var(--tab);color:var(--tab);}
.subject-tab.active{color:#fff;border-color:transparent;}
.subject-tab[data-subject="ly"]{--tab:#2563eb;}.subject-tab[data-subject="ly"].active{background:#2563eb;}
.subject-tab[data-subject="sinh"]{--tab:#16a34a;}.subject-tab[data-subject="sinh"].active{background:#16a34a;}
.subject-tab[data-subject="tin"]{--tab:#7c3aed;}.subject-tab[data-subject="tin"].active{background:#7c3aed;}
.subject-tab[data-subject="su"]{--tab:#ea580c;}.subject-tab[data-subject="su"].active{background:#ea580c;}
.subject-tab[data-subject="hoa"]{--tab:#dc2626;}.subject-tab[data-subject="hoa"].active{background:#dc2626;}
.subject-tab[data-subject="anh"]{--tab:#0891b2;}.subject-tab[data-subject="anh"].active{background:#0891b2;}
.subject-tab[data-subject="toan"]{--tab:#4f46e5;}.subject-tab[data-subject="toan"].active{background:#4f46e5;}
.subject-tab[data-subject].active{box-shadow:0 4px 12px color-mix(in srgb,var(--tab) 35%,transparent);}

/* ===== NOTICE ===== */
.subject-notice{background:var(--notice-bg);border:1px solid var(--notice-border);border-left:4px solid var(--tab,var(--blue,#2563eb));border-radius:10px;padding:12px 16px;margin-bottom:16px;font-size:14px;color:var(--text-sub);display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
.subject-notice i{font-size:15px;flex-shrink:0;color:var(--tab,var(--blue,#2563eb));}
.subject-notice strong{color:var(--text);}

/* ===== LỊCH HỌC & LỊCH THI (iframe) ===== */
.schedule-embed{margin-bottom:8px;}
.schedule-embed iframe{width:100%;height:330px;display:block;transition:height 0.3s ease;}
@media(max-width:640px){.schedule-embed iframe{height:300px;}}

/* ===== GRID ===== */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px;width:100%;}

/* ===== CARD ===== */
.card{
  background:var(--card-bg);
  border:1px solid var(--card-border);
  border-radius:16px;
  padding:0;
  display:flex;flex-direction:column;
  transition:transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
  position:relative;overflow:hidden;
  animation:cardFadeIn 0.28s ease both;
  animation-delay:calc(var(--card-index, 0) * 0.06s);
}
@keyframes cardFadeIn{
  from{opacity:0;transform:translateY(8px);}
  to{opacity:1;transform:translateY(0);}
}
.card-color-bar{
  height:4px;width:100%;
  background:linear-gradient(90deg,var(--card-color),color-mix(in srgb,var(--card-color) 50%,white));
}
.card-body{padding:14px 14px 16px;display:flex;flex-direction:column;gap:8px;}
.card:hover{
  transform:translateY(-2px);
  box-shadow:0 8px 24px color-mix(in srgb,var(--card-color,#2563eb) 12%,transparent);
  border-color:color-mix(in srgb,var(--card-color,#2563eb) 35%,var(--card-border));
}
.card.active-card{
  border-color:color-mix(in srgb,var(--card-color,#2563eb) 45%,var(--card-border));
  box-shadow:0 0 0 2px color-mix(in srgb,var(--card-color,#2563eb) 18%,transparent),0 8px 28px color-mix(in srgb,var(--card-color,#2563eb) 14%,transparent);
}

.card-top{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.card-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff;background:var(--card-color,#2563eb);flex-shrink:0;}
.card h3{margin:0;font-size:16px;font-weight:700;color:var(--text);line-height:1.4;flex:1 1 0;}
.card-desc{font-size:14px;color:var(--text-sub);line-height:1.5;margin:0;}

/* ===== STATUS ===== */
.status{flex-shrink:0;display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;white-space:nowrap;padding:4px 10px;border-radius:20px;}
.status.done{background:rgba(16,185,129,0.1);color:#10b981;}
.status.done::before{content:"";width:7px;height:7px;border-radius:50%;background:#10b981;flex-shrink:0;}
.status.done::after{content:"Hoàn thành";}
.status.pending{background:rgba(245,158,11,0.1);color:#d97706;}
.status.pending::before{content:"";width:7px;height:7px;border-radius:50%;background:#d97706;flex-shrink:0;}
.status.pending::after{content:"Chưa hoàn thành";}

/* ===== BUTTON ===== */
.card .btn-row{margin-top:8px;}
.card .btn{display:inline-flex;align-items:center;gap:6px;padding:9px 20px;border-radius:10px;font-size:14px;font-weight:600;text-decoration:none;color:#fff;background:var(--card-color,#2563eb);transition:all 0.2s;cursor:pointer;border:none;}
.card .btn:hover{filter:brightness(1.1);box-shadow:0 4px 14px color-mix(in srgb,var(--card-color,#2563eb) 35%,transparent);}
.card .btn.disabled{opacity:0.5;pointer-events:none;}

/* ===== DARK MODE ===== */
body.dark-mode .card{box-shadow:0 2px 8px rgba(0,0,0,0.25);}
body.dark-mode .card:hover{box-shadow:0 8px 28px color-mix(in srgb,var(--card-color,#2563eb) 20%,rgba(0,0,0,0.3));}
body.dark-mode .card-color-bar{background:linear-gradient(90deg,var(--card-color),color-mix(in srgb,var(--card-color) 60%,#0f172a));}
body.dark-mode .subject-notice{border-color:var(--notice-border);}

.tab-short{display:none;}
@media (max-width:768px){
  .tab-full{display:none;}
  .tab-short{display:inline;}
  body{padding:2px 4px 10px;}
  .subject-tabs{gap:6px;padding-bottom:6px;}
  .subject-tab{padding:8px 4px;font-size:11px;border-radius:9px;}
  .subject-block{padding:10px 10px 14px;border-radius:12px;}
  .grid{grid-template-columns:1fr;gap:8px;}
  .card{border-radius:12px;box-shadow:none;animation:cardFadeInMobile 0.16s ease both;animation-delay:calc(var(--card-index, 0) * 0.04s);}
  .card:hover{transform:none;box-shadow:none;}
  .card-body{padding:10px 10px 12px;gap:6px;}
  .card h3{font-size:14px;}
  .card-desc{font-size:12px;line-height:1.4;}
  .card .btn{padding:8px 14px;font-size:13px;}
  .quiz-box{margin-top:12px;border-radius:6px;}
  .quiz-header{padding:6px 6px 8px;}
}
@keyframes cardFadeInMobile{
  from{opacity:0;transform:translateY(4px);}
  to{opacity:1;transform:translateY(0);}
}

@media (prefers-reduced-motion: reduce){
  .card,.card:hover,.subject-tab{transition:none !important;animation:none !important;}
}

/* ===== QUIZ ===== */
.quiz-box{margin-top:16px;background:var(--quiz-bg);border:1px solid var(--quiz-border);border-radius:10px;overflow:hidden;}
.quiz-header{padding:8px 8px;display:flex;justify-content:flex-start;border-bottom:1px solid var(--quiz-border);}
.quiz-btn{padding:6px 12px;border-radius:8px;border:none;cursor:pointer;font-weight:600;font-size:13px;}
.close-btn{background:#ef4444;color:#fff;}
.skel-bar{background:var(--border);border-radius:8px;height:16px;margin-bottom:8px;}
.skel-quiz-topbar{display:flex;gap:12px;margin-bottom:14px;}
.skel-quiz-card{height:200px;border-radius:14px;margin-bottom:12px;}
.skel-quiz-row{display:flex;gap:10px;}
.loader{padding:20px;}

/* ===== YOUTUBE VIDEO PLAYER (MOS-STYLE) ===== */
.video-box{width:100%;margin:16px auto 0;}
.video-box .video-topbar{display:flex;justify-content:flex-end;margin-bottom:8px;}
.video-frame{
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  overflow: hidden;
  border-radius: 14px;
  background: #111827;
  box-shadow: 0 12px 28px rgba(17, 24, 39, 0.14);
}
.video-frame iframe{
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
}

/* ===== GRAMMAR PLAYER (video 16:9 + mục lục bên cạnh) ===== */
.grammar-player-content{display:flex;align-items:flex-start;gap:14px;width:100%;}
.grammar-player-content .video-frame{flex:1 1 68%;min-width:0;margin:0;align-self:flex-start;}
.grammar-sidebar{flex:0 0 260px;align-self:stretch;display:flex;flex-direction:column;min-height:0;background:var(--card-bg);border:1px solid var(--card-border);border-radius:14px;overflow:hidden;}
.grammar-sidebar-header{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;font-size:12.5px;font-weight:800;letter-spacing:.02em;text-transform:uppercase;color:var(--text-sub);background:var(--notice-bg);border-bottom:1px solid var(--card-border);}
.watched-counter{font-size:11px;font-weight:700;letter-spacing:0;text-transform:none;color:var(--text-sub);white-space:nowrap;}
.watched-counter b{color:#16a34a;font-weight:800;}
.grammar-sidebar-list{list-style:none;margin:0;padding:6px;overflow-y:auto;flex:1 1 auto;min-height:0;}
.grammar-sidebar-item{display:flex;align-items:center;gap:8px;padding:10px 12px;margin-bottom:4px;border-radius:10px;font-size:13px;font-weight:600;line-height:1.3;color:var(--text-sub);cursor:pointer;transition:background .18s,color .18s;}
.grammar-sidebar-item i{flex-shrink:0;font-size:11px;}
.grammar-sidebar-item:hover{background:var(--notice-bg);color:var(--text);}
.grammar-sidebar-item.active{background:var(--tab,#0891b2);color:#fff;}
.grammar-sidebar-item .watched-tick{display:none;margin-left:auto;color:#16a34a;font-size:14px;}
.grammar-sidebar-item.watched .watched-tick{display:inline-block;}
.grammar-sidebar-item.active .watched-tick{color:#fff;}
.grammar-sidebar-item.math-pending{opacity:0.55;cursor:default;pointer-events:none;}
.grammar-sidebar-item.math-pending:hover{background:transparent;color:var(--text-sub);}
.grammar-sidebar-item.math-pending .math-pending-tag{margin-left:auto;flex-shrink:0;}
.math-pending-tag{font-size:10px;font-weight:700;line-height:1;padding:3px 7px;border-radius:20px;background:rgba(245,158,11,0.12);color:#d97706;white-space:nowrap;}
@media (max-width:768px){
  .grammar-player-content{flex-direction:column;}
  .grammar-sidebar{flex:0 0 auto;align-self:stretch;border-radius:12px;}
}
.video-frame.pdf-mode{aspect-ratio:auto;height:75vh;max-height:820px;min-height:420px;}
.video-frame.pdf-mode iframe{width:100%;height:100%;border:0;background:#fff;}
@media (max-width:768px){
  .video-frame.pdf-mode{height:60vh;min-height:320px;}
}
</style>
<script src="../version/version-check.js" defer></script>
<script src="../toast.js"></script>
</head>
<body>

<div class="schedule-embed">
  <iframe id="scheduleFrame" src="lich-hoc.html" title="Lịch học và lịch thi"></iframe>
</div>

<div class="subject-block">
  <div class="subject-title"><i class="fas fa-book-open"></i> Danh sách môn học</div>
  <!-- Tabs + panels + cards được render từ phonghoc-data.js (code bên dưới) -->
  <div class="subject-tabs" id="subjectTabs"></div>
  <div id="subjectPanels"></div>
</div>

<div id="quiz"></div>

<script>
/* ============================================================
   PHÒNG HỌC - LOGIC
   ------------------------------------------------------------
   Dữ liệu (môn học / card / khóa video) nằm ở phonghoc-data.js.
   File này chứa: render tabs/cards từ data + trình phát video
   (YouTube API, Google Drive, PDF) + nhúng bài test (loadQuiz).
   ============================================================ */

function applyCardDominoEffect() {
  document.querySelectorAll('.grid').forEach(function(grid) {
    var cards = grid.querySelectorAll('.card');
    if (cards.length <= 1) {
      cards.forEach(function(card) {
        card.style.removeProperty('--card-index');
      });
      return;
    }
    cards.forEach(function(card, index) {
      card.style.setProperty('--card-index', index);
    });
  });
}

function switchSubject(id) {
  var sf = document.getElementById("scheduleFrame");
  if (sf && sf.contentWindow) {
    sf.contentWindow.postMessage({ type: "SCHEDULE_COLLAPSE" }, "*");
    sf.style.height = "52px";
  }
  var quizEl = document.getElementById("quiz");
  if (quizEl && quizEl.innerHTML.trim() !== "") {
    closeQuiz();
  }
  document.querySelectorAll('.subject-tab').forEach(t => t.classList.remove('active'));
  document.querySelector('.subject-tab[data-subject="' + id + '"]').classList.add('active');
  document.querySelectorAll('.subject-panel').forEach(p => p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  applyCardDominoEffect();
}

window.learnHubUser = null;

window.addEventListener('DOMContentLoaded', applyCardDominoEffect);
window.addEventListener('load', applyCardDominoEffect);
window.addEventListener('message', function(event) {
  if (!event.data) return;
  if (event.data.type === 'SCHEDULE_HEIGHT') {
    var sf = document.getElementById("scheduleFrame");
    if (sf && event.data.height) sf.style.height = event.data.height;
  }
  if (event.data.type === 'LEARNHUB_USER') {
    window.learnHubUser = event.data.user;
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type: 'LEARNHUB_REQUEST_WATCHED', uid: event.data.user && event.data.user.uid }, '*');
    }
  }
  if (event.data.type === 'LEARNHUB_WATCHED_LIST') {
    applyWatchedList(event.data.videoIds);
  }
  if (event.data.type === 'LEARNHUB_TEST_RESULT') {
    if (window.parent && window.parent !== window) {
      window.parent.postMessage(event.data, '*');
    }
  }
  if (event.data.type === 'LEARNHUB_TEST_RESULT_ACK') {
    var qf = document.getElementById("quizFrame");
    if (qf && qf.contentWindow) {
      qf.contentWindow.postMessage(event.data, '*');
    }
  }
  if (event.data.type === 'DARK_MODE') {
    document.body.classList.toggle('dark-mode', !!event.data.value);
    var sf = document.getElementById("scheduleFrame");
    if (sf && sf.contentWindow) {
      sf.contentWindow.postMessage({ type: 'DARK_MODE', value: !!event.data.value }, '*');
    }
  }
});

function lockPageScroll() {
  document.body.style.overflow = 'hidden';
  document.documentElement.style.overflow = 'hidden';
}

function unlockPageScroll() {
  document.body.style.overflow = '';
  document.documentElement.style.overflow = '';
}

function loadQuiz(btn, link) {
  document.querySelectorAll(".card").forEach(c => c.classList.remove("active-card"));
  var card = btn.closest(".card");
  if (card) card.classList.add("active-card");

  lockPageScroll();
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: "LOCK_PAGE_SCROLL" }, "*");
  }

  document.getElementById("quiz").innerHTML =
    '<div class="quiz-box" style="position:relative; width:100%; height:100vh; max-height:100vh; overflow:hidden; margin:0; padding:0; border-left:0; border-right:0; border-radius:0;">' +
      '<iframe id="quizFrame" src="' + link + '" style="display:none; width:100%; height:100%; border:0; outline:0; margin:0; padding:0; overscroll-behavior:contain;"></iframe>' +
      '<div class="quiz-header" style="position:absolute; top:8px; left:8px; right:auto; z-index:9999; pointer-events:auto; padding:0;">' +
        '<button class="quiz-btn close-btn" onclick="closeQuiz();">Đóng bài</button>' +
      '</div>' +
      '<div class="loader" id="loader" style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; z-index:5000; background:rgba(255,255,255,0.85);">' +
        '<div style="width:100%; max-width:900px; padding:20px;">' +
          '<div class="skel-quiz-topbar"><div class="skel-bar" style="width:90px;height:24px;border-radius:8px;"></div><div class="skel-bar" style="width:60px;height:24px;border-radius:8px;"></div></div>' +
          '<div class="skel-bar" style="width:100%;height:16px;margin-bottom:8px;"></div>' +
          '<div class="skel-bar" style="width:70%;height:16px;margin-bottom:16px;"></div>' +
          '<div class="skel-bar skel-quiz-card"></div>' +
          '<div class="skel-quiz-row"><div class="skel-bar" style="width:90px;height:42px;border-radius:12px;"></div><div class="skel-bar" style="width:90px;height:42px;border-radius:12px;"></div><div class="skel-bar" style="width:90px;height:42px;border-radius:12px;"></div></div>' +
        '</div>' +
      '</div>' +
    '</div>';

  setTimeout(function() {
    var q = document.getElementById("quiz");
    if (q) q.scrollIntoView({ behavior: "smooth", block: "start" });
  }, 50);

  var iframe = document.getElementById("quizFrame");
  var loader = document.getElementById("loader");

  iframe.onload = function() {
    loader.style.display = "none";
    iframe.style.display = "block";
    if (window.learnHubUser) {
      iframe.contentWindow.postMessage({ type: "LEARNHUB_USER", user: window.learnHubUser }, "*");
    }
    clearTimeout(window.__quizLoadTimer);
    document.getElementById("quiz").scrollIntoView({ behavior: "smooth", block: "start" });
  };

  // 🕐 Watchdog: nếu iframe bài test không tải được trong 20s thì ghi log lỗi
  clearTimeout(window.__quizLoadTimer);
  window.__quizLoadTimer = setTimeout(function() {
    var fr = document.getElementById("quizFrame");
    if (fr && fr.style.display !== "block") {
      if (window.logAppError) {
        window.logAppError({
          source: "quiz",
          category: "feature",
          level: "error",
          code: "QUIZ_FRAME_LOAD_TIMEOUT",
          message: "Iframe bài test không tải được trong 20s (trang test không hiển thị).",
          detail: { link: String(link || "").slice(0, 200) }
        });
      }
    }
  }, 20000);
}

function closeQuiz() {
  stopWatchTimer();
  if (ytPlayer && typeof ytPlayer.destroy === "function") {
    try { ytPlayer.destroy(); } catch (e) {}
  }
  ytPlayer = null;
  currentVideoId = null;
  document.getElementById("quiz").innerHTML = "";
  document.querySelectorAll(".card").forEach(c => c.classList.remove("active-card"));
  unlockPageScroll();
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: "UNLOCK_PAGE_SCROLL" }, "*");
    window.parent.postMessage({ type: "CLOSE_QUIZ_SCROLL_TOP" }, "*");
  }
}

/* ===== ESCAPE HELPER ===== */
function escHtml(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function escJs(s) {
  return String(s == null ? "" : s).replace(/\\/g, "\\\\").replace(/'/g, "\\'");
}

/* ============================================================
   RENDER TABS + PANELS + CARDS từ window.PHONGHOC_SUBJECTS
   ============================================================ */
function renderCard(c) {
  var iconStyle = c.iconBg ? ' style="background:' + escHtml(c.iconBg) + '"' : "";
  var statusCls = c.status === "pending" ? "pending" : "done";

  var btn;
  if (c.disabled) {
    btn = '<a class="btn disabled" href="#">Sắp ra mắt</a>';
  } else if (c.action && c.action.type === "video") {
    btn = '<a class="btn" href="#" onclick="openCourse(this,\'' + escJs(c.action.course) +
      '\'); return false;">' + escHtml(c.btnLabel || "Xem video") + '</a>';
  } else if (c.action && c.action.url) {
    btn = '<a class="btn" href="#" onclick="loadQuiz(this,\'' + escJs(c.action.url) +
      '\'); return false;">' + escHtml(c.btnLabel || "Làm bài") + '</a>';
  } else {
    btn = '<a class="btn disabled" href="#">Sắp ra mắt</a>';
  }

  return (
    '<div class="card">' +
      '<div class="card-color-bar"></div>' +
      '<div class="card-body">' +
        '<div class="card-top">' +
          '<div class="card-icon"' + iconStyle + '><i class="fas ' + escHtml(c.icon || "fa-book") + '"></i></div>' +
          '<h3>' + escHtml(c.title) + '</h3>' +
          '<span class="status ' + statusCls + '"></span>' +
        '</div>' +
        '<p class="card-desc">' + escHtml(c.description) + '</p>' +
        '<div class="btn-row">' + btn + '</div>' +
      '</div>' +
    '</div>'
  );
}

function renderPhongHoc() {
  var subjects = window.PHONGHOC_SUBJECTS || [];
  var tabsHtml = "";
  var panelsHtml = "";

  subjects.forEach(function (s) {
    tabsHtml +=
      '<button class="subject-tab" data-subject="' + escHtml(s.id) +
      '" onclick="switchSubject(\'' + escJs(s.id) + '\')">' +
        '<i class="fas ' + escHtml(s.icon) + '"></i> ' +
        '<span class="tab-full">' + escHtml(s.name) + '</span>' +
        '<span class="tab-short">' + escHtml(s.short || s.name) + '</span>' +
      '</button>';

    var noticeHtml = "";
    if (s.notice) {
      noticeHtml =
        '<div class="subject-notice"><i class="fas ' + escHtml(s.notice.icon || "fa-bell") + '"></i> ' +
        (s.notice.html || "") +
        '</div>';
    }
    var cardsHtml = (s.cards || []).map(renderCard).join("");

    panelsHtml +=
      '<div id="' + escHtml(s.id) + '" class="subject-panel" style="--tab:' + escHtml(s.tabColor) +
      ';--card-color:' + escHtml(s.cardColor || s.tabColor) + ';">' +
        noticeHtml +
        '<div class="grid">' + cardsHtml + '</div>' +
      '</div>';
  });

  var tabsWrap = document.getElementById("subjectTabs");
  var panelsWrap = document.getElementById("subjectPanels");
  if (tabsWrap) tabsWrap.innerHTML = tabsHtml;
  if (panelsWrap) panelsWrap.innerHTML = panelsHtml;

  if (typeof applyCardDominoEffect === "function") applyCardDominoEffect();
}

/* ============================================================
   TRÌNH PHÁT VIDEO (mục lục sidebar + YouTube IFrame API)
   ============================================================ */

/* --- YouTube IFrame Player API: theo dõi tiến độ xem để tick "đã xem" ---
   Chỉ video YouTube được track (xem >= 75% mới tính, lưu ID xuống DB).
   Google Drive / PDF chỉ mở xem trực tiếp, không track. */
var ytPlayer = null;
var currentVideoId = null;
var watchProgressTimer = null;
var watchedVideoIds = new Set();

var __ytFallbackCb = null;
function ensureYouTubeAPI(callback) {
  __ytFallbackCb = callback;
  if (window.YT && window.YT.Player) { __ytFallbackCb = null; callback(); return; }
  if (!window.__ytApiLoading) {
    window.__ytApiLoading = true;
    var tag = document.createElement("script");
    tag.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(tag);
  }
  var prevReady = window.onYouTubeIframeAPIReady;
  window.onYouTubeIframeAPIReady = function() {
    if (typeof prevReady === "function") prevReady();
    if (window.__ytFallbackTimer) { clearTimeout(window.__ytFallbackTimer); window.__ytFallbackTimer = null; }
    __ytFallbackCb = null;
    callback();
  };
  if (!window.__ytFallbackTimer) {
    window.__ytFallbackTimer = setTimeout(function() {
      window.__ytFallbackTimer = null;
      if (window.YT && window.YT.Player) return;
      var cb = __ytFallbackCb;
      __ytFallbackCb = null;
      if (typeof cb === "function") cb();
    }, 5000);
  }
}

function createYTPlayer(elementId, videoId) {
  stopWatchTimer();
  if (ytPlayer && typeof ytPlayer.destroy === "function") {
    try { ytPlayer.destroy(); } catch (e) {}
  }
  ytPlayer = null;
  currentVideoId = videoId;
  var host = document.getElementById(elementId);
  if (!host) return;
  if (!window.YT || !window.YT.Player) {
    host.innerHTML = getYoutubeIframeHtml(getYoutubeEmbedUrl("https://www.youtube.com/watch?v=" + videoId));
    return;
  }
  try {
    ytPlayer = new YT.Player(elementId, {
      videoId: videoId,
      playerVars: { rel: 0 },
      events: { onStateChange: onYTStateChange }
    });
  } catch (e) {
    ytPlayer = null;
    host.innerHTML = getYoutubeIframeHtml(getYoutubeEmbedUrl("https://www.youtube.com/watch?v=" + videoId));
  }
}

function onYTStateChange(e) {
  if (e.data === YT.PlayerState.PLAYING) {
    startWatchTimer();
  } else {
    stopWatchTimer();
  }
}

function startWatchTimer() {
  stopWatchTimer();
  watchProgressTimer = setInterval(checkWatchProgress, 1000);
}

function stopWatchTimer() {
  if (watchProgressTimer) { clearInterval(watchProgressTimer); watchProgressTimer = null; }
}

function checkWatchProgress() {
  if (!ytPlayer || !currentVideoId || watchedVideoIds.has(currentVideoId)) return;
  var duration = ytPlayer.getDuration ? ytPlayer.getDuration() : 0;
  var time = ytPlayer.getCurrentTime ? ytPlayer.getCurrentTime() : 0;
  if (duration > 0 && time / duration >= 0.75) {
    markVideoWatched(currentVideoId);
  }
}

function markVideoWatched(videoId) {
  watchedVideoIds.add(videoId);
  var item = document.querySelector('.grammar-sidebar-item[data-video="' + videoId + '"]');
  if (item) item.classList.add("watched");
  updateWatchedCounter();
  if (window.learnHubUser && window.learnHubUser.uid && window.parent && window.parent !== window) {
    window.parent.postMessage({
      type: "LEARNHUB_VIDEO_WATCHED",
      uid: window.learnHubUser.uid,
      videoId: videoId
    }, "*");
  }
}

function applyWatchedList(videoIds) {
  watchedVideoIds = new Set(Array.isArray(videoIds) ? videoIds : []);
  document.querySelectorAll(".grammar-sidebar-item[data-video]").forEach(function(li) {
    var vid = li.getAttribute("data-video");
    li.classList.toggle("watched", !!vid && watchedVideoIds.has(vid));
  });
  updateWatchedCounter();
}

function updateWatchedCounter() {
  var sidebar = document.querySelector(".grammar-sidebar");
  var counter = sidebar ? sidebar.querySelector(".watched-counter") : null;
  if (!counter) return;
  var total = 0;
  var watched = 0;
  sidebar.querySelectorAll(".grammar-sidebar-item[data-video]").forEach(function(li) {
    total++;
    var vid = li.getAttribute("data-video");
    if (vid && watchedVideoIds.has(vid)) watched++;
  });
  counter.innerHTML = total ? 'Đã xem <b>' + watched + '</b>/' + total : "";
}

function initSidebarTicks() {
  document.querySelectorAll(".grammar-sidebar-item[data-video]").forEach(function(li) {
    if (!li.querySelector(".watched-tick")) {
      var tick = document.createElement("i");
      tick.className = "fas fa-check-circle watched-tick";
      li.appendChild(tick);
    }
    var vid = li.getAttribute("data-video");
    if (vid && watchedVideoIds.has(vid)) li.classList.add("watched");
  });
  updateWatchedCounter();
}

function switchSidebarVideo(item) {
  var raw = item.getAttribute("data-video");
  if (!raw) return;
  var videoId = extractVideoId(raw);
  document.querySelectorAll(".grammar-sidebar-item").forEach(function(el) {
    el.classList.remove("active");
  });
  item.classList.add("active");

  /* Đang ở chế độ PDF -> dựng lại khung player */
  var frame = document.querySelector(".video-frame");
  if (frame && frame.classList.contains("pdf-mode")) {
    if (ytPlayer && typeof ytPlayer.destroy === "function") {
      try { ytPlayer.destroy(); } catch (e) {}
    }
    ytPlayer = null;
    frame.classList.remove("pdf-mode");
    frame.innerHTML = '<div id="ytPlayerHost"></div>';
    currentVideoId = videoId;
    ensureYouTubeAPI(function() { createYTPlayer("ytPlayerHost", videoId); });
    return;
  }

  currentVideoId = videoId;
  if (ytPlayer && typeof ytPlayer.loadVideoById === "function") {
    ytPlayer.loadVideoById(videoId);
  } else {
    /* FIX: fallback iframe tĩnh (YouTube API không tải được) trước đây
       chỉ đổi highlight mà không đổi video -> dựng lại player thủ công.
       Nhánh này cũng xử lý lúc vừa thoát khỏi chế độ Drive/PDF. */
    stopWatchTimer();
    if (ytPlayer && typeof ytPlayer.destroy === "function") {
      try { ytPlayer.destroy(); } catch (e) {}
    }
    ytPlayer = null;
    if (frame) {
      frame.innerHTML = '<div id="ytPlayerHost"></div>';
      ensureYouTubeAPI(function() { createYTPlayer("ytPlayerHost", videoId); });
    }
  }
}

function switchSidebarPdf(item) {
  var pdf = item.getAttribute("data-pdf");
  if (!pdf) return;
  document.querySelectorAll(".grammar-sidebar-item").forEach(function(el) {
    el.classList.remove("active");
  });
  item.classList.add("active");
  showPdfPlayer(pdf);
}

/* ===== GOOGLE DRIVE (video/tài liệu trong mục lục) ===== */

/* Chấp nhận: link file /file/d/<ID>/view... , link ?id=<ID>,
   link thư mục /drive/folders/<ID>, hoặc ID trần */
function getDriveFileId(url) {
  if (!url) return "";
  var s = String(url).trim();
  var m = s.match(/\/file\/d\/([\w-]+)/);
  if (m && m[1]) return m[1];
  m = s.match(/\/folders\/([\w-]+)/);
  if (m && m[1]) return m[1];
  m = s.match(/[?&]id=([\w-]+)/);
  if (m && m[1]) return m[1];
  if (/^[\w-]{20,}$/.test(s)) return s;
  return "";
}

function getDriveEmbedUrl(url) {
  var id = getDriveFileId(url);
  if (!id) return url ? String(url).trim() : "";
  /* Link thư mục -> dạng xem lưới để duyệt tài liệu trong iframe */
  if (/\/folders\//.test(String(url))) {
    return "https://drive.google.com/embeddedfolderview?id=" + id + "#grid";
  }
  return "https://drive.google.com/file/d/" + id + "/preview";
}

function showDrivePlayer(driveUrl) {
  stopWatchTimer();
  if (ytPlayer && typeof ytPlayer.destroy === "function") {
    try { ytPlayer.destroy(); } catch (e) {}
  }
  ytPlayer = null;
  currentVideoId = null;
  var frame = document.querySelector(".video-frame");
  if (!frame) return;
  frame.classList.remove("pdf-mode");
  frame.innerHTML =
    '<iframe src="' + escHtml(getDriveEmbedUrl(driveUrl)) +
    '" title="Google Drive" allow="autoplay; encrypted-media" allowfullscreen="true"></iframe>';
}

function switchSidebarDrive(item) {
  var drive = item.getAttribute("data-drive");
  if (!drive) return;
  document.querySelectorAll(".grammar-sidebar-item").forEach(function(el) {
    el.classList.remove("active");
  });
  item.classList.add("active");
  showDrivePlayer(drive);
}

function getPdfEmbedUrl(url) {
  if (!url) return "";
  var m = String(url).match(/\/file\/d\/([^/?#]+)/);
  if (m && m[1]) return "https://drive.google.com/file/d/" + m[1] + "/preview";
  return url;
}

function showPdfPlayer(pdfUrl) {
  stopWatchTimer();
  if (ytPlayer && typeof ytPlayer.destroy === "function") {
    try { ytPlayer.destroy(); } catch (e) {}
  }
  ytPlayer = null;
  currentVideoId = null;
  var frame = document.querySelector(".video-frame");
  if (!frame) return;
  frame.classList.add("pdf-mode");
  frame.innerHTML = '<iframe src="' + escHtml(getPdfEmbedUrl(pdfUrl)) + '" title="Tài liệu PDF"></iframe>';
}

/* Chấp nhận cả ID YouTube lẫn link đầy đủ (watch/youtu.be/shorts/embed) */
function extractVideoId(v) {
  var s = String(v == null ? "" : v).trim();
  if (/^[\w-]{11}$/.test(s)) return s;
  var embed = getYoutubeEmbedUrl(s);
  var m = embed && embed.match(/\/embed\/([\w-]+)$/);
  return m ? m[1] : s;
}

function getYoutubeEmbedUrl(url) {
  try {
    const parsed = new URL(url);
    let videoId = "";

    if (parsed.hostname.includes("youtu.be")) {
      videoId = parsed.pathname.slice(1);
    } else if (parsed.hostname.includes("youtube.com")) {
      if (parsed.pathname.startsWith("/shorts/")) {
        videoId = parsed.pathname.split("/")[2] || "";
      } else if (parsed.pathname.startsWith("/embed/")) {
        videoId = parsed.pathname.split("/")[2] || "";
      } else {
        videoId = parsed.searchParams.get("v") || "";
      }
    }

    if (!videoId) {
      return "";
    }

    return `https://www.youtube.com/embed/${videoId}`;
  } catch {
    return "";
  }
}

function getYoutubeIframeHtml(embedUrl) {
  return `
    <iframe
      src="${embedUrl}"
      title="Video"
      frameborder="0"
      allowfullscreen="true"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share">
    </iframe>
  `;
}

/* ============================================================
   MỞ KHÓA VIDEO (đọc nội dung từ window.VIDEO_COURSES)
   ============================================================ */
function openCourse(el, courseId) {
  document.querySelectorAll(".card").forEach(c => c.classList.remove("active-card"));
  var card = el ? el.closest(".card") : null;
  if (card) card.classList.add("active-card");

  var courses = window.VIDEO_COURSES || [];
  var course = null;
  for (var i = 0; i < courses.length; i++) {
    if (courses[i].id === courseId) { course = courses[i]; break; }
  }
  if (!course) {
    if (window.lhToast) lhToast("Không tìm thấy khóa học video: " + courseId, 'error');
    return;
  }

  var mathCls = course.math ? " math-sidebar-item" : "";
  var itemsHtml = "";
  var firstItem = null;

  (course.items || []).forEach(function(it, idx) {
    var activeCls = idx === 0 ? " active" : "";
    if (it.pending) {
      itemsHtml +=
        '<li class="grammar-sidebar-item' + mathCls + ' math-pending"><i class="fas fa-hourglass-half"></i> ' +
        escHtml(it.label) + '<span class="math-pending-tag">Chưa có video</span></li>';
      return;
    }
    if (it.video) {
      itemsHtml +=
        '<li class="grammar-sidebar-item' + mathCls + activeCls + '" data-video="' + escHtml(it.video) +
        '" onclick="switchSidebarVideo(this)"><i class="fas fa-play-circle"></i> ' + escHtml(it.label) + '</li>';
    } else if (it.pdf) {
      itemsHtml +=
        '<li class="grammar-sidebar-item' + mathCls + activeCls + '" data-pdf="' + escHtml(it.pdf) +
        '" onclick="switchSidebarPdf(this)"><i class="fas fa-file-pdf"></i> ' + escHtml(it.label) + '</li>';
    } else if (it.drive) {
      itemsHtml +=
        '<li class="grammar-sidebar-item' + mathCls + activeCls + '" data-drive="' + escHtml(it.drive) +
        '" onclick="switchSidebarDrive(this)"><i class="fas ' +
        (/folders\//.test(String(it.drive || "")) ? "fa-folder-open" : "fa-file-video") +
        '"></i> ' + escHtml(it.label) + '</li>';
    } else {
      return;
    }
    if (idx === 0) firstItem = it;
  });

  document.getElementById("quiz").innerHTML =
    '<div class="video-box">' +
      '<div class="video-topbar">' +
        '<button class="quiz-btn close-btn" onclick="closeQuiz();">Đóng video</button>' +
      '</div>' +
      '<div class="grammar-player-content">' +
        '<div class="video-frame">' +
          '<div id="ytPlayerHost"></div>' +
        '</div>' +
        '<div class="grammar-sidebar">' +
          '<div class="grammar-sidebar-header">Mục lục<span class="watched-counter"></span></div>' +
          '<ul class="grammar-sidebar-list">' + itemsHtml + '</ul>' +
        '</div>' +
      '</div>' +
    '</div>';

  initSidebarTicks();

  if (firstItem && firstItem.pdf) {
    showPdfPlayer(firstItem.pdf);
  } else if (firstItem && firstItem.drive) {
    showDrivePlayer(firstItem.drive);
  } else if (firstItem && firstItem.video) {
    var firstVideoId = extractVideoId(firstItem.video);
    ensureYouTubeAPI(function() { createYTPlayer("ytPlayerHost", firstVideoId); });
  }

  setTimeout(function() {
    var q = document.getElementById("quiz");
    if (q) q.scrollIntoView({ behavior: "smooth", block: "start" });
  }, 50);
}

/* ===== KHỞI TẠO RENDER ===== */
if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", renderPhongHoc);
} else {
  renderPhongHoc();
}
</script>
